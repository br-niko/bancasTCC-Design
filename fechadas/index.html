<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bancas TCC · Bacharelado em Design — Senac (Fechadas — Não divulgar)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-page: #fbf8f7;
      --surface: #ffffff;
      --surface-muted: #fdfbfa;
      --grid-cell-bg: #faf6f4;
      --grid-cell-past: #f4eeeb;
      --grid-cell-today: #ffffff;
      --border: #eae2de;
      --border-subtle: #f3ece9;
      --text-primary: #231f20;
      --text-secondary: #4d4748;
      --text-muted: #6d6e71;
      --accent-brand: #ed1651;
      --accent-brand-dark: #b80d3d;
      --accent-soft: #fdeef3;
      --accent-border: #f4b2c5;
      --accent-coral: #ef4955;
      --accent-indigo: #3c51a3;
      --accent-purple: #864e9f;
      --radius-lg: 6px;
      --radius-md: 4px;
      --radius-pill: 999px;
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
      --font-title: "Gloock", Georgia, serif;
      --sticky-top: 0px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      color: var(--text-primary);
      background: var(--bg-page);
      min-height: 100vh;
      overflow-x: clip;
      -webkit-font-smoothing: antialiased;
    }

    .closed-warning-banner {
      background: #ed1651;
      color: #ffffff;
      border-bottom: 2px solid #b80d3d;
      padding: 11px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.01em;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 95;
    }

    .app-shell {
      width: 100%;
      max-width: none;
      margin: 0 auto;
      padding: 14px 16px 36px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }

    .top-bar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: stretch;
    }

    .header-main {
      padding: 16px 20px;
      border-top: 3px solid var(--accent-brand);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
    }

    .header-top-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .brand-course-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .senac-wordmark {
      height: 17px;
      width: auto;
      display: block;
      fill: var(--text-primary);
      flex-shrink: 0;
    }

    .brand-course-name {
      font-family: var(--font-title);
      font-size: 22px;
      font-weight: 400;
      color: var(--accent-brand);
      letter-spacing: 0.005em;
      line-height: 1.08;
    }

    .brand-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand-title-row h1 {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-primary);
    }

    .brand-subtitle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      color: var(--text-secondary);
      flex-wrap: wrap;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 10px;
      border-radius: var(--radius-pill);
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      font-size: 11.5px;
      font-weight: 700;
      color: var(--accent-brand-dark);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-brand);
    }

    .header-today-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius-pill);
      background: var(--accent-brand);
      border: 1px solid var(--accent-brand);
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.02em;
    }

    .header-today-pill:hover {
      background: var(--accent-brand-dark);
      border-color: var(--accent-brand-dark);
    }

    .mini-cal-card {
      padding: 12px 16px;
      min-width: 244px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }

    .mini-cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-primary);
    }

    .mini-cal-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent-brand);
      letter-spacing: 0.03em;
    }

    .mini-cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      text-align: center;
    }

    .mini-wd {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      padding-bottom: 2px;
    }

    .mini-day {
      font-size: 11px;
      font-weight: 600;
      height: 23px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      color: var(--text-muted);
      border: 1px solid transparent;
      background: transparent;
      cursor: default;
      font-family: inherit;
    }

    .mini-day.has-banca {
      color: var(--text-primary);
      cursor: pointer;
      background: var(--accent-soft);
      border-color: var(--accent-border);
    }

    .mini-day.has-banca.is-active-week {
      border-color: var(--accent-brand);
      font-weight: 700;
    }

    .mini-day.has-banca:hover {
      background: #fad7e2;
      border-color: var(--accent-brand);
    }

    .mini-day.has-banca::after {
      content: "";
      position: absolute;
      bottom: 2px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent-brand);
    }

    .mini-day.is-today {
      background: var(--accent-brand);
      color: #fff;
      border-color: var(--accent-brand);
    }

    .mini-day.is-today::after {
      background: #fff;
    }

    .mini-day.is-past {
      opacity: 0.52;
    }

    .mini-day.empty-for-filter {
      opacity: 0.3;
    }

    .search-bar-panel {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-inputs-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      flex: 1;
      width: 100%;
    }

    .autocomplete-wrap {
      position: relative;
      display: flex;
      align-items: center;
      flex: 0 1 290px;
      min-width: 220px;
    }

    .autocomplete-wrap svg {
      position: absolute;
      left: 12px;
      color: var(--text-muted);
      pointer-events: none;
      z-index: 1;
    }

    .search-input {
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-primary);
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 8px 32px 8px 35px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-input:hover {
      border-color: #d2c6c1;
      background: #fff;
    }

    .search-input:focus {
      background: #fff;
      border-color: var(--accent-brand);
      box-shadow: 0 0 0 3px rgba(237, 22, 81, 0.12);
    }

    .clear-inline-btn {
      position: absolute;
      right: 8px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: none;
      background: #ede4e0;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .clear-inline-btn.visible {
      display: inline-flex;
    }

    .clear-inline-btn:hover {
      background: var(--text-primary);
      color: #ffffff;
    }

    .autocomplete-dropdown {
      position: absolute;
      top: calc(100% + 5px);
      left: 0;
      right: 0;
      z-index: 80;
      background: #ffffff;
      border: 1px solid #dcd1cc;
      border-radius: 6px;
      box-shadow: 0 12px 26px -8px rgba(35, 31, 32, 0.18);
      max-height: 280px;
      overflow-y: auto;
      display: none;
      padding: 4px;
    }

    .autocomplete-dropdown.open {
      display: block;
    }

    .autocomplete-item {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      border-radius: 4px;
      padding: 8px 10px;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--text-primary);
    }

    .autocomplete-item:hover,
    .autocomplete-item.is-active {
      background: var(--accent-soft);
    }

    .autocomplete-item-main {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .autocomplete-item-col {
      display: flex;
      flex-direction: column;
      min-width: 0;
      gap: 2px;
    }

    .autocomplete-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .autocomplete-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .autocomplete-title mark {
      background: #fad4e0;
      color: var(--accent-brand-dark);
      border-radius: 2px;
      padding: 0 1px;
    }

    .autocomplete-sub {
      font-size: 11.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .autocomplete-count {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-secondary);
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 2px 7px;
      flex-shrink: 0;
    }

    .autocomplete-empty {
      padding: 10px 12px;
      font-size: 12.5px;
      color: var(--text-muted);
      text-align: center;
    }

    .active-filter-banner {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px 5px 12px;
      border-radius: var(--radius-pill);
      background: var(--text-primary);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
    }

    .clear-filter-btn {
      border: none;
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .clear-filter-btn:hover {
      background: var(--accent-brand);
    }

    .calendar-panel {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .calendar-nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .calendar-nav-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .calendar-range-label {
      font-size: 12.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-primary);
    }

    .nav-pill-btn {
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 5px 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .nav-pill-btn:hover {
      background: var(--accent-soft);
      border-color: var(--accent-brand);
      color: var(--accent-brand-dark);
    }

    .nav-pill-btn.is-active {
      background: var(--accent-soft);
      border: 1px solid var(--accent-brand);
      color: var(--accent-brand);
    }

    .calendar-nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }

    .view-switcher {
      display: inline-flex;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 2px;
      gap: 2px;
    }

    .view-switch-btn {
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
    }

    .view-switch-btn:hover:not(.active) {
      color: var(--accent-brand);
    }

    .view-switch-btn.active {
      background: var(--accent-brand);
      color: #ffffff;
    }

    .scroll-arrows {
      display: none;
      align-items: center;
      gap: 6px;
    }

    .scroll-arrows.visible {
      display: inline-flex;
    }

    .scroll-arrow-btn {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--surface-muted);
      color: var(--text-primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .scroll-arrow-btn:hover:not(:disabled) {
      background: #ffffff;
      border-color: var(--accent-brand);
      color: var(--accent-brand);
    }

    .scroll-arrow-btn:disabled {
      opacity: 0.28;
      cursor: not-allowed;
      pointer-events: none;
    }

    .calendar-scroll {
      overflow: visible;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--grid-cell-bg);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: 56px repeat(var(--day-cols, 5), minmax(0, 1fr));
      width: 100%;
      min-width: 0;
    }

    .cal-corner {
      position: sticky;
      top: var(--sticky-top, 0px);
      left: 0;
      z-index: 25;
      padding: 10px 7px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      background: var(--surface-muted);
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-top-left-radius: 5px;
    }

    .cal-day-header {
      position: sticky;
      top: var(--sticky-top, 0px);
      z-index: 20;
      padding: 8px 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: var(--surface-muted);
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      min-width: 0;
    }

    .cal-day-header.is-last-day {
      border-right: none;
      border-top-right-radius: 5px;
    }

    .cal-day-header.is-today {
      background: #ffffff;
      border-bottom-color: var(--accent-border);
      box-shadow: inset 0 3px 0 var(--accent-brand);
    }

    .cal-day-header.is-today .day-weekday,
    .cal-day-header.is-today .day-num,
    .cal-day-header.is-today .day-month-txt {
      color: var(--accent-brand);
    }

    .cal-day-header.is-past {
      background: #f5efec;
    }

    .cal-day-header.is-past .day-weekday,
    .cal-day-header.is-past .day-num,
    .cal-day-header.is-past .day-month-txt {
      color: var(--text-muted);
    }

    .day-title-group {
      display: flex;
      align-items: baseline;
      gap: 4px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .day-num {
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
    }

    .day-weekday {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .day-month-txt {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .day-header-badges {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .today-badge {
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 6px;
      border-radius: 3px;
      background: var(--accent-brand);
      color: #fff;
    }

    .past-badge {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 5px;
      border-radius: 3px;
      background: #ece4e0;
      color: var(--text-secondary);
    }

    .day-count-badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: var(--radius-pill);
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .day-count-badge.has-items {
      color: var(--accent-brand-dark);
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
    }

    .cal-time-cell {
      position: sticky;
      left: 0;
      z-index: 4;
      padding: 8px 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-start;
      border-bottom: 1px solid var(--border-subtle);
      border-right: 1px solid var(--border);
      background: var(--surface-muted);
    }

    .cal-time-label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }

    .cal-time-sub {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 1px;
      font-variant-numeric: tabular-nums;
    }

    .cal-slot-cell {
      position: relative;
      padding: 4px;
      border-bottom: 1px solid var(--border-subtle);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 104px;
      min-width: 0;
      background: var(--grid-cell-bg);
    }

    .cal-slot-cell.is-last-day {
      border-right: none;
    }

    .cal-slot-cell.is-today {
      background: var(--grid-cell-today);
      border-right-color: var(--accent-border);
    }

    .cal-slot-cell.is-past {
      background: var(--grid-cell-past);
    }

    .cal-slot-cell.row-empty {
      min-height: 34px;
      padding: 3px 5px;
    }

    .cal-time-cell.row-empty {
      padding: 6px 8px;
      justify-content: center;
    }

    .cal-time-cell.row-empty .cal-time-sub {
      display: none;
    }

    .now-time-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--accent-brand);
      z-index: 3;
      pointer-events: none;
    }

    .now-time-badge {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      background: var(--accent-brand);
      color: #ffffff;
      font-size: 9.5px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      font-variant-numeric: tabular-nums;
    }

    .banca-card {
      width: 100%;
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
      padding: 7px 9px 8px 10px;
      border-radius: 4px;
      background: var(--card-bg, #fdeef3);
      border: 1px solid var(--card-border, #f4b2c5);
      border-left: 4px solid var(--card-accent, #ed1651);
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      transition: background-color 0.12s ease, border-color 0.12s ease;
    }

    .banca-card:hover {
      background: var(--card-bg-hover, #fbdce6);
      border-color: var(--card-accent, #ed1651);
      border-left-color: var(--card-accent, #ed1651);
    }

    .banca-card.highlighted {
      border-color: var(--card-accent, #ed1651);
    }

      flex-direction: column;

    function getTodayIso() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function getScheduleTimelineContext(todayIso) {
      const days = SCHEDULE_DATA.days || [];
      if (!days.length) {
        return { firstDate: "", lastDate: "", isOngoing: false, hasStarted: false, focusDate: "", pastCount: 0 };
      }
      const firstDate = days[0].date;
      const lastDate = days[days.length - 1].date;
      const isOngoing = todayIso >= firstDate && todayIso <= lastDate;
      const hasStarted = todayIso >= firstDate;
      let focusDate = firstDate;
      if (isOngoing) {
        const nextOrToday = days.find(d => d.date >= todayIso);
        focusDate = nextOrToday ? nextOrToday.date : lastDate;
      } else if (todayIso > lastDate) {
        focusDate = firstDate;
      }
      const pastCount = isOngoing ? days.filter(d => d.date < focusDate).length : 0;
      return { firstDate, lastDate, isOngoing, hasStarted, focusDate, pastCount };
    }

    function getInitialWeek(todayIso, days) {
      if (!days || !days.length) return 1;
      const week1Days = days.filter(d => d.weekNum === 1);
      const week1LastDate = week1Days.length ? week1Days[week1Days.length - 1].date : "2026-12-04";
      return todayIso > week1LastDate ? 2 : 1;
    }

    function normText(s) {
      return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function highlightMatchHtml(text, rawQuery) {
      const str = String(text || "");
      const q = normText(rawQuery.trim());
      if (!q) return escapeHtml(str);
      const normStr = normText(str);
      const idx = normStr.indexOf(q);
      if (idx === -1) return escapeHtml(str);
      let rawStart = -1;
      let rawEnd = -1;
      let normPos = 0;
      for (let i = 0; i < str.length; i++) {
        const chNorm = normText(str[i]);
        if (normPos === idx && rawStart === -1) rawStart = i;
        normPos += chNorm.length;
        if (normPos >= idx + q.length && rawEnd === -1) {
          rawEnd = i + 1;
          break;
        }
      }
      if (rawStart === -1 || rawEnd === -1) return escapeHtml(str);
      return (
        escapeHtml(str.slice(0, rawStart)) +
        "<mark>" + escapeHtml(str.slice(rawStart, rawEnd)) + "</mark>" +
        escapeHtml(str.slice(rawEnd))
      );
    }

    function hasActiveSearchFilter() {
      return Boolean(state.selectedProfessor || state.profQuery.trim() || state.studentQuery.trim());
    }

    function getFilteredBancas() {
      const sq = normText(state.studentQuery.trim());
      const pq = normText(state.profQuery.trim());
      return SCHEDULE_DATA.bancas.filter(b => {
        if (state.selectedProfessor && !b.professors.some(p => p.name === state.selectedProfessor)) {
          return false;
        }
        if (!state.selectedProfessor && pq && !b.professors.some(p => normText(p.name).includes(pq))) {
          return false;
        }
        if (sq && !normText(b.student).includes(sq)) {
          return false;
        }
        return true;
      });
    }

    function getVisibleDays(ctx, filteredBancas) {
      const allDays = SCHEDULE_DATA.days || [];
      if (!allDays.length) return [];
      const currentWeek = state.selectedWeek || 1;
      const weekDays = allDays.filter(d => d.weekNum === currentWeek);
      const targetDays = weekDays.length ? weekDays : allDays;

      if (state.hidePastDays && ctx.isOngoing && ctx.pastCount > 0) {
        const remaining = targetDays.filter(d => d.date >= ctx.focusDate);
        if (remaining.length > 0) return remaining;
      }
      return targetDays;
    }

    function getProfSuggestions(query) {
      const q = normText(query.trim());
      const profs = SCHEDULE_DATA.professors || [];
      if (!q) return profs.slice(0, 20);
      return profs
        .filter(p => normText(p.name).includes(q))
        .sort((a, b) => {
          const aStarts = normText(a.name).startsWith(q) ? 0 : 1;
          const bStarts = normText(b.name).startsWith(q) ? 0 : 1;
          if (aStarts !== bStarts) return aStarts - bStarts;
          return (b.count - a.count) || a.name.localeCompare(b.name, "pt-BR");
        })
        .slice(0, 15);
    }

    function getStudentSuggestions(query) {
      const q = normText(query.trim());
      const dayMap = new Map((SCHEDULE_DATA.days || []).map(d => [d.date, d]));
      const list = (SCHEDULE_DATA.bancas || [])
        .filter(b => b.student)
        .filter(b => !q || normText(b.student).includes(q))
        .sort((a, b) => {
          if (q) {
            const aStarts = normText(a.student).startsWith(q) ? 0 : 1;
            const bStarts = normText(b.student).startsWith(q) ? 0 : 1;
            if (aStarts !== bStarts) return aStarts - bStarts;
          }
          return a.student.localeCompare(b.student, "pt-BR");
        })
        .slice(0, 18);
      return list.map(b => ({ banca: b, day: dayMap.get(b.date) }));
    }

    function closeDropdowns() {
      state.activeDropdown = null;
      state.dropdownHighlightIdx = -1;
      profDropdown.classList.remove("open");
      studentDropdown.classList.remove("open");
      profSearchInput.setAttribute("aria-expanded", "false");
      studentSearchInput.setAttribute("aria-expanded", "false");
    }

    function renderProfDropdown() {

              <span class="autocomplete-item-main">

    function renderStudentDropdown() {
      const items = getStudentSuggestions(studentSearchInput.value);
      state.activeDropdown = "student";
      state.dropdownHighlightIdx = -1;
      studentSearchInput.setAttribute("aria-expanded", "true");
      profDropdown.classList.remove("open");
      profSearchInput.setAttribute("aria-expanded", "false");

      if (!items.length) {
        studentDropdown.innerHTML = '<div class="autocomplete-empty">Nenhum estudante encontrado</div>';
      } else {
        studentDropdown.innerHTML = items.map((entry, idx) => {
          const b = entry.banca;
          const dayLabel = entry.day ? entry.day.label : b.date;
          return `
            <button type="button" class="autocomplete-item" role="option" data-student="${escapeHtml(b.student)}" data-date="${b.date}" data-idx="${idx}">
              <span class="autocomplete-item-col" style="min-width:0;flex:1;">
                <span class="autocomplete-title">${highlightMatchHtml(b.student, studentSearchInput.value)}</span>
                <span class="autocomplete-sub">${escapeHtml(dayLabel)} · ${b.startTime} · ${escapeHtml(b.title)}</span>
              </span>
            </button>
          `;
        }).join("");
      }

      studentDropdown.classList.add("open");
      studentDropdown.querySelectorAll(".autocomplete-item").forEach(btn => {
        btn.addEventListener("click", () => {
          applySelectedStudent(btn.dataset.student, btn.dataset.date);
          closeDropdowns();
        });
      });
    }

    function handleDropdownKeydown(e, type) {
      const dropdown = type === "prof" ? profDropdown : studentDropdown;
      if (!dropdown.classList.contains("open")) {
        if (e.key === "ArrowDown") {
          e.preventDefault();
          if (type === "prof") renderProfDropdown();
          else renderStudentDropdown();
        }
        return;
      }
      const items = Array.from(dropdown.querySelectorAll(".autocomplete-item"));
      if (!items.length) return;

      if (e.key === "ArrowDown") {
        e.preventDefault();
        state.dropdownHighlightIdx = (state.dropdownHighlightIdx + 1) % items.length;
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        state.dropdownHighlightIdx = state.dropdownHighlightIdx <= 0 ? items.length - 1 : state.dropdownHighlightIdx - 1;
      } else if (e.key === "Enter") {
        e.preventDefault();
        const target = items[state.dropdownHighlightIdx >= 0 ? state.dropdownHighlightIdx : 0];
        if (target) target.click();
        return;
      } else if (e.key === "Escape" || e.key === "Tab") {
        closeDropdowns();
        return;
      } else {
        return;
      }

      items.forEach((el, i) => el.classList.toggle("is-active", i === state.dropdownHighlightIdx));
      if (items[state.dropdownHighlightIdx]) {
        items[state.dropdownHighlightIdx].scrollIntoView({ block: "nearest" });
      }
    }

    function applySelectedProfessor(profName) {
      state.selectedProfessor = profName;
      state.profQuery = "";
      profSearchInput.value = profName;
      clearProfSearchBtn.classList.add("visible");
      const profBancas = SCHEDULE_DATA.bancas.filter(b => b.professors.some(p => p.name === profName));
      if (profBancas.length) {
        const hasCurrentWeek = profBancas.some(b => {
          const d = SCHEDULE_DATA.days.find(day => day.date === b.date);
          return d && d.weekNum === state.selectedWeek;
        });
        if (!hasCurrentWeek) {
          const firstBancaDay = SCHEDULE_DATA.days.find(d => d.date === profBancas[0].date);
          if (firstBancaDay && firstBancaDay.weekNum) {
            state.selectedWeek = firstBancaDay.weekNum;
          }
        }
      }
      if (state.viewMode === "list") {
        state.selectedMobileDay = "all";
      }
      render();
    }

    function applySelectedStudent(studentName, dateStr) {
      state.studentQuery = studentName;
      studentSearchInput.value = studentName;
      clearStudentSearchBtn.classList.add("visible");
      if (dateStr) {
        const dayObj = SCHEDULE_DATA.days.find(d => d.date === dateStr);
        if (dayObj && dayObj.weekNum) {
          state.selectedWeek = dayObj.weekNum;
        }
      }
      if (state.viewMode === "list" && dateStr) {
        state.selectedMobileDay = dateStr;
      }
      render();
      if (dateStr && state.viewMode === "grid") {
        scrollToDateColumn(dateStr);
      }
    }

    function selectProfessor(profName) {
      if (state.selectedProfessor === profName) {
        state.selectedProfessor = null;
        state.profQuery = "";
        profSearchInput.value = "";
        clearProfSearchBtn.classList.remove("visible");
      } else {
        applySelectedProfessor(profName);
        return;
      }
      render();
    }

    function scrollToDateColumn(dateStr) {
      if (calendarScroll.scrollWidth <= calendarScroll.clientWidth + 4) return;
      const targetDay = calendarGrid.querySelector(`.cal-day-header[data-date="${dateStr}"]`);
      if (targetDay) {
        targetDay.scrollIntoView({ behavior: "smooth", inline: "start", block: "nearest" });
      }
    }

    function renderHeaderMeta(filteredBancas, todayIso, ctx) {
      if (SCHEDULE_DATA.days.length) {
        const first = SCHEDULE_DATA.days[0];
        const last = SCHEDULE_DATA.days[SCHEDULE_DATA.days.length - 1];
        dateSpanText.textContent = `${String(first.dayNum).padStart(2, "0")} ${first.monthLabel} – ${String(last.dayNum).padStart(2, "0")} ${last.monthLabel} ${last.year || 2026}`;
      }

      const all = filteredBancas.length;
      const terms = [];
      if (state.selectedProfessor) terms.push(state.selectedProfessor);
      else if (state.profQuery.trim()) terms.push(`prof. "${state.profQuery.trim()}"`);
      if (state.studentQuery.trim()) terms.push(`estudante "${state.studentQuery.trim()}"`);

      if (terms.length) {
        summaryText.textContent = `${all} ${all === 1 ? "banca" : "bancas"} (${terms.join(" · ")})`;
      } else {
        summaryText.textContent = `${all} ${all === 1 ? "banca" : "bancas"}`;
      }

      if (state.selectedProfessor) {
        activeFilterBanner.style.display = "inline-flex";
        activeFilterName.textContent = state.selectedProfessor;
      } else {
        activeFilterBanner.style.display = "none";
      }

      if (ctx.isOngoing) {
        jumpTodayBtn.style.display = "inline-flex";
        const focusDayObj = (SCHEDULE_DATA.days || []).find(d => d.date === ctx.focusDate);
        const isExactToday = ctx.focusDate === todayIso;
        jumpTodayBtn.textContent = isExactToday
          ? "Ir para hoje"
          : (focusDayObj ? `Próximo dia (${focusDayObj.weekdayShort} ${String(focusDayObj.dayNum).padStart(2, "0")})` : "Hoje");
      } else {
        jumpTodayBtn.style.display = "none";
      }
    }

    function renderMiniCalendar(filteredBancas, todayIso) {
      if (!SCHEDULE_DATA.days.length) return;
      const activeDates = new Set(filteredBancas.map(b => b.date));
      const allBancaDates = new Set(SCHEDULE_DATA.bancas.map(b => b.date));

      const firstParts = SCHEDULE_DATA.days[0].date.split("-").map(Number);
      const lastParts = SCHEDULE_DATA.days[SCHEDULE_DATA.days.length - 1].date.split("-").map(Number);
      const startDt = new Date(Date.UTC(firstParts[0], firstParts[1] - 1, firstParts[2]));
      const startDow = (startDt.getUTCDay() + 6) % 7;
      startDt.setUTCDate(startDt.getUTCDate() - startDow);

      const endDt = new Date(Date.UTC(lastParts[0], lastParts[1] - 1, lastParts[2]));
      const endDow = (endDt.getUTCDay() + 6) % 7;
      endDt.setUTCDate(endDt.getUTCDate() + (6 - endDow));

      const monthsSeen = Array.from(new Set(SCHEDULE_DATA.days.map(d => d.monthLabel)));
      const yr = SCHEDULE_DATA.days[0].year || Number(SCHEDULE_DATA.days[0].date.slice(0, 4));
      miniCalMonthLabel.textContent = `${monthsSeen.join(" / ")} ${yr}`;

      const headers = ["S", "T", "Q", "Q", "S", "S", "D"];
      let html = headers.map(h => `<div class="mini-wd">${h}</div>`).join("");

      for (let cur = new Date(startDt); cur <= endDt; cur.setUTCDate(cur.getUTCDate() + 1)) {
        const y = cur.getUTCFullYear();
        const m = cur.getUTCMonth() + 1;
        const d = cur.getUTCDate();
        const iso = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

        const hasAny = allBancaDates.has(iso);
        const hasFiltered = activeDates.has(iso);
        const dayObj = SCHEDULE_DATA.days.find(x => x.date === iso);

        const classes = ["mini-day"];
        if (hasAny) classes.push("has-banca");
        if (iso === todayIso) classes.push("is-today");
        if (hasAny && iso < todayIso) classes.push("is-past");
        if (hasAny && !hasFiltered) classes.push("empty-for-filter");
        if (dayObj && dayObj.weekNum === state.selectedWeek) classes.push("is-active-week");

        html += `<button type="button" class="${classes.join(" ")}" data-date="${iso}" title="${dayObj ? dayObj.label : ""}">${d}</button>`;
      }

      miniCalGrid.innerHTML = html;
      miniCalGrid.querySelectorAll("[data-date]").forEach(el => {
        el.addEventListener("click", () => {
          const dateStr = el.dataset.date;
          if (!allBancaDates.has(dateStr)) return;
          const clickedDay = SCHEDULE_DATA.days.find(d => d.date === dateStr);
          if (clickedDay && clickedDay.weekNum) {
            state.selectedWeek = clickedDay.weekNum;
          }
          if (dateStr < todayIso && state.hidePastDays) {
            state.hidePastDays = false;
          }
          if (state.viewMode === "list") {
            state.selectedMobileDay = dateStr;
            render();
          } else {
            render();
            requestAnimationFrame(() => scrollToDateColumn(dateStr));
          }
        });
      });
    }

    function updateScrollArrows() {
      if (state.viewMode !== "grid") {
        scrollArrows.classList.remove("visible");
        return;
      }
      scrollArrows.classList.add("visible");
      const currentWeek = state.selectedWeek || 1;
      const maxWeeks = 2;
      scrollLeftBtn.disabled = currentWeek <= 1;
      scrollRightBtn.disabled = currentWeek >= maxWeeks;
      scrollLeftBtn.title = currentWeek > 1 ? "Ver Semana 1 (30 Nov – 04 Dez)" : "Semana 1 (atual)";
      scrollLeftBtn.setAttribute("aria-label", "Semana 1");
      scrollRightBtn.title = currentWeek < maxWeeks ? "Ver Semana 2 (07 Dez – 09 Dez)" : "Semana 2 (atual)";
      scrollRightBtn.setAttribute("aria-label", "Semana 2");
    }

    function buildBancaCardHtml(banca, colorTheme) {
      const cardVars = [
        `--card-bg: ${colorTheme.bg}`,
        `--card-bg-hover: ${colorTheme.bgHover}`,
        `--card-border: ${colorTheme.border}`,
        `--card-accent: ${colorTheme.accent}`,
        `--card-accent-dark: ${colorTheme.accentDark}`
      ].join("; ");

      const hasConfirm = banca.professors.some(p => p.needsConfirm);
      const profHtml = banca.professors.map(p => {
        const isSel = state.selectedProfessor === p.name ? "is-selected" : "";
        const confirmCls = p.needsConfirm ? "needs-confirm" : "";
        return `<div class="prof-name-line ${isSel} ${confirmCls}" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</div>`;
      }).join("");

      return `
        <button type="button" class="banca-card ${state.selectedProfessor ? "highlighted" : ""}" data-banca-id="${banca.id}" style="${cardVars}">
          <div>
            <div class="banca-card-top">
              <span class="banca-time">${banca.startTime} – ${banca.endTime}</span>
              <div class="banca-badges">
                ${banca.sala ? `<span class="mini-badge badge-sala">${escapeHtml(banca.sala)}</span>` : ""}
                ${banca.isClosed ? '<span class="mini-badge badge-closed">Fechada</span>' : ""}
                ${hasConfirm ? '<span class="mini-badge badge-confirm">Confirmar</span>' : ""}
              </div>
            </div>
            <div class="banca-title" title="${escapeHtml(banca.title)}">${escapeHtml(banca.title)}</div>
            ${banca.student ? `<div class="banca-student" title="${escapeHtml(banca.student)}">${escapeHtml(banca.student)}</div>` : ""}
          </div>
          <div class="banca-profs">
            ${profHtml}
          </div>
        </button>
      `;
    }

    function attachCardModalListeners(container) {
      container.querySelectorAll(".banca-card").forEach(card => {
        card.addEventListener("click", () => {
          const banca = SCHEDULE_DATA.bancas.find(b => b.id === card.dataset.bancaId);
          if (banca) openModal(banca);
        });
      });
    }

    function renderGridCalendar(visibleDays, filteredBancas, todayIso) {
      calendarGrid.style.setProperty("--day-cols", Math.max(visibleDays.length, 1));

      const slotMap = new Map();
      const dayCounts = new Map();
      visibleDays.forEach(d => dayCounts.set(d.date, 0));

      for (const b of filteredBancas) {
        if (dayCounts.has(b.date)) {
          dayCounts.set(b.date, dayCounts.get(b.date) + 1);
          const key = `${b.date}_${b.hour}`;
          if (!slotMap.has(key)) slotMap.set(key, []);
          slotMap.get(key).push(b);
        }
      }

      const now = new Date();
      const nowHour = now.getHours();
      const nowMin = now.getMinutes();
      const nowTimeText = `${String(nowHour).padStart(2, "0")}:${String(nowMin).padStart(2, "0")}`;
      const nowPct = Math.round((nowMin / 60) * 1000) / 10;

      let html = '<div class="cal-corner" aria-hidden="true"></div>';
      visibleDays.forEach((d, dayIdx) => {
        const cnt = dayCounts.get(d.date) || 0;
        const isToday = d.date === todayIso;
        const isPast = d.date < todayIso;
        const isLast = dayIdx === visibleDays.length - 1;
        html += `
          <div class="cal-day-header ${isToday ? "is-today" : ""} ${isPast ? "is-past" : ""} ${isLast ? "is-last-day" : ""}" data-date="${d.date}">
            <div class="day-title-group">
              <span class="day-num">${String(d.dayNum).padStart(2, "0")}</span>
              <span class="day-weekday">${escapeHtml(d.weekdayShort)}</span>
              <span class="day-month-txt">${escapeHtml(d.monthLabel)}</span>
            </div>
            <div class="day-header-badges">
              ${isToday ? '<span class="today-badge">Hoje</span>' : (isPast ? '<span class="past-badge">Anterior</span>' : "")}
              <span class="day-count-badge ${cnt > 0 ? "has-items" : ""}">${cnt}</span>
            </div>
          </div>
        `;
      });

      for (const h of SCHEDULE_DATA.hours) {
        const rowHasAny = visibleDays.some(d => slotMap.has(`${d.date}_${h.hour}`));
        const emptyCls = rowHasAny ? "" : "row-empty";

        html += `
          <div class="cal-time-cell ${emptyCls}">
            <span class="cal-time-label">${h.start}</span>
            <span class="cal-time-sub">${h.end}</span>
          </div>
        `;

        visibleDays.forEach((d, dayIdx) => {
          const isToday = d.date === todayIso;
          const isPast = d.date < todayIso;
          const isLast = dayIdx === visibleDays.length - 1;
          const lastCls = isLast ? "is-last-day" : "";
          const todayCls = isToday ? "is-today" : (isPast ? "is-past" : "");
          const bancasInSlot = slotMap.get(`${d.date}_${h.hour}`) || [];
          const showNowLine = isToday && h.hour === nowHour;
          const nowLineHtml = showNowLine
            ? `<div class="now-time-line" style="top:${nowPct}%"><span class="now-time-badge">${nowTimeText}</span></div>`
            : "";

          if (!bancasInSlot.length) {
            html += `<div class="cal-slot-cell ${emptyCls} ${todayCls} ${lastCls}">${nowLineHtml}</div>`;
          } else {
            const cardsHtml = bancasInSlot.map(banca => {
              const colorTheme = state.selectedProfessor
                ? (profColorMap.get(state.selectedProfessor) || PALETTE[0])
                : PALETTE[(h.hour + d.dayNum) % PALETTE.length];
              return buildBancaCardHtml(banca, colorTheme);
            }).join("");

            html += `<div class="cal-slot-cell ${todayCls} ${lastCls}">${nowLineHtml}${cardsHtml}</div>`;
          }
        });
      }

      calendarGrid.innerHTML = html;
      attachCardModalListeners(calendarGrid);
      requestAnimationFrame(updateScrollArrows);
    }

    function renderAgendaList(visibleDays, filteredBancas, todayIso) {
      const dayCounts = new Map();
      visibleDays.forEach(d => dayCounts.set(d.date, 0));
      for (const b of filteredBancas) {
        if (dayCounts.has(b.date)) {
          dayCounts.set(b.date, dayCounts.get(b.date) + 1);
        }
      }

      if (state.selectedMobileDay !== "all" && !visibleDays.some(d => d.date === state.selectedMobileDay)) {
        state.selectedMobileDay = visibleDays.length ? visibleDays[0].date : "all";
      }

      const totalFiltered = visibleDays.reduce((acc, d) => acc + (dayCounts.get(d.date) || 0), 0);
      let pillsHtml = `
        <button type="button" class="day-pill-btn ${state.selectedMobileDay === "all" ? "active" : ""}" data-mobile-day="all">
          <span>Todos</span>
          <span class="day-pill-count">${totalFiltered}</span>
        </button>
      `;

      for (const d of visibleDays) {
        const cnt = dayCounts.get(d.date) || 0;
        const isToday = d.date === todayIso;
        const isPast = d.date < todayIso;
        const activeCls = state.selectedMobileDay === d.date ? "active" : "";
        pillsHtml += `
          <button type="button" class="day-pill-btn ${activeCls} ${isToday ? "is-today" : ""} ${isPast ? "is-past" : ""}" data-mobile-day="${d.date}">
            <span>${isToday ? "Hoje · " : ""}${escapeHtml(d.weekdayShort)} ${String(d.dayNum).padStart(2, "0")}</span>
            <span class="day-pill-count">${cnt}</span>
          </button>
        `;
      }

      dayPillsBar.innerHTML = pillsHtml;
      dayPillsBar.querySelectorAll("[data-mobile-day]").forEach(btn => {
        btn.addEventListener("click", () => {
          state.selectedMobileDay = btn.dataset.mobileDay;
          render();
        });
      });

      const daysToRender = state.selectedMobileDay === "all"
        ? visibleDays.filter(d => (dayCounts.get(d.date) || 0) > 0)
        : visibleDays.filter(d => d.date === state.selectedMobileDay);

      let listHtml = "";
      for (const d of daysToRender) {
        const dayBancas = filteredBancas
          .filter(b => b.date === d.date)
          .sort((a, b) => a.hour - b.hour);

        const isToday = d.date === todayIso;
        const isPast = d.date < todayIso;
        const cardsHtml = dayBancas.length
          ? dayBancas.map(banca => {
              const colorTheme = state.selectedProfessor
                ? (profColorMap.get(state.selectedProfessor) || PALETTE[0])
                : PALETTE[(banca.hour + d.dayNum) % PALETTE.length];
              return buildBancaCardHtml(banca, colorTheme);
            }).join("")
          : '<div class="empty-week-banner"><p>Nenhuma banca neste dia para os filtros atuais.</p></div>';

        listHtml += `
          <div class="agenda-day-group">
            <div class="agenda-day-header ${isToday ? "is-today" : ""} ${isPast ? "is-past" : ""}">
              <div class="agenda-day-title">
                <span class="day-num">${String(d.dayNum).padStart(2, "0")}</span>
                <span>${escapeHtml(d.weekday)} · ${escapeHtml(d.monthLabel)}</span>
                ${isToday ? '<span class="today-badge">Hoje</span>' : (isPast ? '<span class="past-badge">Anterior</span>' : "")}
              </div>
              <span class="day-count-badge ${dayBancas.length > 0 ? "has-items" : ""}">${dayBancas.length}</span>
            </div>
            <div class="agenda-cards-stack">
              ${cardsHtml}
            </div>
          </div>
        `;
      }

      agendaDaysList.innerHTML = listHtml;
      attachCardModalListeners(agendaDaysList);

      const activePill = dayPillsBar.querySelector(".day-pill-btn.active");
      if (activePill) {
        activePill.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      }
    }

    function renderCalendar(visibleDays, filteredBancas, todayIso, ctx) {
      if (visibleDays.length) {
        const f = visibleDays[0];
        const l = visibleDays[visibleDays.length - 1];
        const weekNum = state.selectedWeek || 1;
        calendarRangeLabel.textContent = `Semana ${weekNum} · ${String(f.dayNum).padStart(2, "0")} ${f.monthLabel} a ${String(l.dayNum).padStart(2, "0")} ${l.monthLabel}`;
      }

      const pastInVisibleWeek = visibleDays.filter(d => d.date < todayIso).length;
      if (ctx.isOngoing && pastInVisibleWeek > 0) {
        togglePastDaysBtn.style.display = "inline-flex";
        togglePastDaysBtn.classList.toggle("is-active", !state.hidePastDays);
        togglePastDaysBtn.textContent = state.hidePastDays
          ? `Mostrar ${pastInVisibleWeek} ${pastInVisibleWeek === 1 ? "dia anterior" : "dias anteriores"}`
          : "Ocultar dias anteriores";
      } else {
        togglePastDaysBtn.style.display = "none";
      }

      viewGridBtn.classList.toggle("active", state.viewMode === "grid");
      viewListBtn.classList.toggle("active", state.viewMode === "list");

      if (state.viewMode === "grid") {
        calendarScroll.classList.remove("hidden");
        agendaView.classList.remove("visible");
        renderGridCalendar(visibleDays, filteredBancas, todayIso);
      } else {
        calendarScroll.classList.add("hidden");
        agendaView.classList.add("visible");
        renderAgendaList(visibleDays, filteredBancas, todayIso);
        updateScrollArrows();
      }

      if (filteredBancas.length === 0) {
        emptyWeekBanner.style.display = "flex";
        const terms = [];
        if (state.selectedProfessor) terms.push(state.selectedProfessor);
        else if (state.profQuery.trim()) terms.push(`prof. "${state.profQuery.trim()}"`);
        if (state.studentQuery.trim()) terms.push(`estudante "${state.studentQuery.trim()}"`);
        emptyWeekMsg.textContent = terms.length
          ? `Nenhuma banca encontrada para ${terms.join(" e ")}.`
          : "Nenhuma banca cadastrada.";
      } else {
        emptyWeekBanner.style.display = "none";
      }
    }

    function openModal(banca) {
      const dayObj = SCHEDULE_DATA.days.find(d => d.date === banca.date);
      modalTimePill.textContent = `${dayObj ? dayObj.weekday + ", " + String(dayObj.dayNum).padStart(2, "0") + " " + dayObj.monthLabel : banca.date} · ${banca.startTime} – ${banca.endTime}${banca.isClosed ? " · Banca Fechada" : ""}`;
      modalTitle.textContent = banca.title;
      modalStudent.textContent = banca.student || "Não informado";

      if (banca.sala) {
        modalSalaSection.style.display = "flex";
        modalSala.textContent = banca.sala;
      } else {
        modalSalaSection.style.display = "none";
      }

      modalProfsList.innerHTML = banca.professors.map(p => {
        const suffix = p.needsConfirm ? " (confirmar)" : "";
        return `<button type="button" class="modal-prof-chip" data-prof="${escapeHtml(p.name)}">${escapeHtml(p.name)}${suffix}</button>`;
      }).join("");

      modalProfsList.querySelectorAll(".modal-prof-chip").forEach(chip => {
        chip.addEventListener("click", () => {
          closeModal();
          selectProfessor(chip.dataset.prof);
        });
      });

      modalBackdrop.classList.add("open");
    }

    function closeModal() {
      modalBackdrop.classList.remove("open");
    }

    function syncStickyTop() {
      const banner = document.querySelector(".closed-warning-banner");
      const h = banner && banner.getBoundingClientRect ? Math.ceil(banner.getBoundingClientRect().height) : 0;
      document.documentElement.style.setProperty("--sticky-top", `${h}px`);
    }

    function render() {
      syncStickyTop();
      const todayIso = getTodayIso();
      const ctx = getScheduleTimelineContext(todayIso);
      const filteredBancas = getFilteredBancas();
      const visibleDays = getVisibleDays(ctx, filteredBancas);

      renderHeaderMeta(filteredBancas, todayIso, ctx);
      renderMiniCalendar(filteredBancas, todayIso);
      renderCalendar(visibleDays, filteredBancas, todayIso, ctx);

      if (!state.didInitialScrollToToday && ctx.isOngoing && state.viewMode === "grid") {
        state.didInitialScrollToToday = true;
        requestAnimationFrame(() => scrollToDateColumn(ctx.focusDate));
      }
    }

    scrollLeftBtn.addEventListener("click", () => {
      if (state.selectedWeek > 1) {
        state.selectedWeek = 1;
        calendarScroll.scrollLeft = 0;
        if (state.viewMode === "list") state.selectedMobileDay = "all";
        render();
      }
    });

    scrollRightBtn.addEventListener("click", () => {
      if (state.selectedWeek < 2) {
        state.selectedWeek = 2;
        calendarScroll.scrollLeft = 0;
        if (state.viewMode === "list") state.selectedMobileDay = "all";
        render();
      }
    });

    calendarScroll.addEventListener("scroll", updateScrollArrows, { passive: true });
    window.addEventListener("resize", () => {
      syncStickyTop();
      if (!state.userPickedView) {
        const preferred = window.innerWidth <= 768 ? "list" : "grid";
        if (state.viewMode !== preferred) {
          state.viewMode = preferred;
          render();
          return;
        }
      }
      updateScrollArrows();
    });

    viewGridBtn.addEventListener("click", () => {
      state.userPickedView = true;
      state.viewMode = "grid";
      render();
    });

    viewListBtn.addEventListener("click", () => {
      state.userPickedView = true;
      state.viewMode = "list";
      render();
    });

    togglePastDaysBtn.addEventListener("click", () => {
      state.hidePastDays = !state.hidePastDays;
      render();
    });

    jumpTodayBtn.addEventListener("click", () => {
      const todayIso = getTodayIso();
      const ctx = getScheduleTimelineContext(todayIso);
      if (!ctx.focusDate) return;
      const todayDay = SCHEDULE_DATA.days.find(d => d.date === todayIso);
      if (todayDay && todayDay.weekNum) {
        state.selectedWeek = todayDay.weekNum;
      }
      if (state.viewMode === "list") {
        state.selectedMobileDay = ctx.focusDate;
        render();
      } else {
        render();
        scrollToDateColumn(ctx.focusDate);
      }
    });

    clearFilterBtn.addEventListener("click", () => {
      state.selectedProfessor = null;
      state.profQuery = "";
      profSearchInput.value = "";
      clearProfSearchBtn.classList.remove("visible");
      render();
    });

    profSearchInput.addEventListener("focus", () => {
      renderProfDropdown();
    });

    profSearchInput.addEventListener("input", e => {
      state.profQuery = e.target.value;
      if (state.selectedProfessor && state.profQuery !== state.selectedProfessor) {
        state.selectedProfessor = null;
      }
      clearProfSearchBtn.classList.toggle("visible", Boolean(state.profQuery));
      if (state.profQuery.trim()) {
        const matches = getFilteredBancas();
        if (matches.length) {
          const inCur = matches.some(b => {
            const d = SCHEDULE_DATA.days.find(day => day.date === b.date);
            return d && d.weekNum === state.selectedWeek;
          });
          if (!inCur) {
            const firstD = SCHEDULE_DATA.days.find(d => d.date === matches[0].date);
            if (firstD && firstD.weekNum) state.selectedWeek = firstD.weekNum;
          }
        }
      }
      if (state.viewMode === "list" && state.profQuery.trim()) {
        state.selectedMobileDay = "all";
      }
      render();
      renderProfDropdown();
    });

    profSearchInput.addEventListener("keydown", e => handleDropdownKeydown(e, "prof"));

    clearProfSearchBtn.addEventListener("click", () => {
      state.selectedProfessor = null;
      state.profQuery = "";
      profSearchInput.value = "";
      clearProfSearchBtn.classList.remove("visible");
      render();
      renderProfDropdown();
      profSearchInput.focus();
    });

    studentSearchInput.addEventListener("focus", () => {
      renderStudentDropdown();
    });

    studentSearchInput.addEventListener("input", e => {
      state.studentQuery = e.target.value;
      clearStudentSearchBtn.classList.toggle("visible", Boolean(state.studentQuery));
      if (state.studentQuery.trim()) {
        const matches = getFilteredBancas();
        if (matches.length) {
          const inCur = matches.some(b => {
            const d = SCHEDULE_DATA.days.find(day => day.date === b.date);
            return d && d.weekNum === state.selectedWeek;
          });
          if (!inCur) {
            const firstD = SCHEDULE_DATA.days.find(d => d.date === matches[0].date);
            if (firstD && firstD.weekNum) state.selectedWeek = firstD.weekNum;
          }
        }
      }
      if (state.viewMode === "list" && state.studentQuery.trim()) {
        state.selectedMobileDay = "all";
      }
      render();
      renderStudentDropdown();
    });

    studentSearchInput.addEventListener("keydown", e => handleDropdownKeydown(e, "student"));

    clearStudentSearchBtn.addEventListener("click", () => {
      state.studentQuery = "";
      studentSearchInput.value = "";
      clearStudentSearchBtn.classList.remove("visible");
      render();
      renderStudentDropdown();
      studentSearchInput.focus();
    });

    document.addEventListener("click", e => {
      if (!profAutocompleteWrap.contains(e.target) && !studentAutocompleteWrap.contains(e.target)) {
        closeDropdowns();
      }
    });

    modalCloseBtn.addEventListener("click", closeModal);
    modalBackdrop.addEventListener("click", e => {
      if (e.target === modalBackdrop) closeModal();
    });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        closeModal();
        closeDropdowns();
      }
    });

    setInterval(() => {
      if (state.viewMode === "grid") {
        const ctx = getScheduleTimelineContext(getTodayIso());
        if (ctx.isOngoing) render();
      }
    }, 60000);

    render();
  </script>
</body>
</html>
