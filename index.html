<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bancas TCC Design</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #d7ecff 0%, #eaf4ff 42%, #f4f8ff 100%);
      --glass-surface: rgba(255, 255, 255, 0.56);
      --glass-surface-strong: rgba(255, 255, 255, 0.78);
      --glass-border: rgba(255, 255, 255, 0.86);
      --text-primary: #142238;
      --text-secondary: #4e617b;
      --text-muted: #7b8da6;
      --accent-blue: #2f80ed;
      --shadow-panel: 0 20px 50px -18px rgba(32, 68, 120, 0.14), 0 4px 16px -4px rgba(32, 68, 120, 0.06);
      --shadow-card: 0 4px 14px -4px rgba(25, 55, 100, 0.08);
      --radius-xl: 26px;
      --radius-pill: 999px;
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      color: var(--text-primary);
      background: var(--bg-gradient);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    /* Ambient floating glassmorphic backdrop orbs */
    .ambient-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(75px);
      opacity: 0.65;
    }

    .orb-1 {
      width: 520px;
      height: 520px;
      top: -140px;
      left: -80px;
      background: radial-gradient(circle, #a8d8ff 0%, rgba(168, 216, 255, 0) 70%);
    }

    .orb-2 {
      width: 600px;
      height: 600px;
      top: 12%;
      right: -120px;
      background: radial-gradient(circle, #cde2ff 0%, rgba(205, 226, 255, 0) 70%);
    }

    .orb-3 {
      width: 480px;
      height: 480px;
      bottom: -120px;
      left: 32%;
      background: radial-gradient(circle, #d7f5ee 0%, rgba(215, 245, 238, 0) 70%);
    }

    .app-shell {
      position: relative;
      z-index: 1;
      max-width: 1500px;
      margin: 0 auto;
      padding: 22px 24px 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .glass-panel {
      background: var(--glass-surface);
      backdrop-filter: blur(24px) saturate(165%);
      -webkit-backdrop-filter: blur(24px) saturate(165%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-panel), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-xl);
    }

    /* Top Header Row */
    .top-bar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: stretch;
    }

    .header-main {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }

    .header-top-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }



    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      background: linear-gradient(145deg, rgba(66, 153, 255, 0.92), rgba(47, 128, 237, 0.78));
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow: 0 10px 22px -6px rgba(47, 128, 237, 0.42), inset 0 1px 1px rgba(255, 255, 255, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .brand-subtitle {
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      flex-wrap: wrap;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.95);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #2f80ed;
    }

    /* Upload Spreadsheet Button & Controls */
    .upload-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .upload-btn {
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      color: #1659b8;
      background: rgba(255, 255, 255, 0.76);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: var(--radius-pill);
      padding: 8px 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 4px 12px -4px rgba(32, 68, 120, 0.14), inset 0 1px 0 #fff;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .upload-btn:hover {
      background: rgba(255, 255, 255, 0.96);
      transform: translateY(-1px);
      box-shadow: 0 10px 20px -6px rgba(47, 128, 237, 0.24), inset 0 1px 0 #fff;
    }

    .reset-source-btn {
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: var(--radius-pill);
      padding: 7px 11px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .reset-source-btn:hover {
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-primary);
    }

    .source-file-tag {
      font-size: 11.5px;
      color: var(--text-muted);
      max-width: 240px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Segmented Week Switcher */
    .search-bar-panel {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .search-inputs-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      flex: 1;
    }

    /* Mini Monthly Calendar Card */
    .mini-cal-card {
      padding: 14px 18px;
      min-width: 248px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
    }

    .mini-cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .mini-cal-badge {
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background: rgba(47, 128, 237, 0.12);
      color: var(--accent-blue);
    }

    .mini-cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      text-align: center;
    }

    .mini-wd {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      padding-bottom: 2px;
    }

    .mini-day {
      font-size: 11px;
      font-weight: 600;
      height: 24px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      color: var(--text-muted);
      border: 1px solid transparent;
      background: transparent;
      cursor: default;
      font-family: inherit;
    }

    .mini-day.has-banca {
      color: var(--text-primary);
      cursor: pointer;
      background: rgba(255, 255, 255, 0.55);
      border-color: rgba(255, 255, 255, 0.8);
      transition: all 0.18s ease;
    }

    .mini-day.has-banca:hover {
      background: rgba(255, 255, 255, 0.92);
      transform: translateY(-1px);
    }

    .mini-day.in-active-week {
      background: rgba(66, 153, 255, 0.20);
      border-color: rgba(66, 153, 255, 0.45);
      color: #1659b8;
    }

    .mini-day.has-banca::after {
      content: "";
      position: absolute;
      bottom: 2px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #2f80ed;
    }

    .mini-day.empty-for-filter {
      opacity: 0.35;
    }

    /* Professor Pills Filter Section */
    .pills-panel {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pills-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .pills-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pills-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
    }

    .active-filter-banner {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px 4px 12px;
      border-radius: var(--radius-pill);
      background: rgba(47, 128, 237, 0.13);
      border: 1px solid rgba(47, 128, 237, 0.25);
      font-size: 12.5px;
      font-weight: 600;
      color: #1659b8;
    }

    .clear-filter-btn {
      border: none;
      background: rgba(255, 255, 255, 0.85);
      color: #1659b8;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
    }

    .clear-filter-btn:hover {
      transform: scale(1.1);
      background: #fff;
    }

    .pills-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box svg {
      position: absolute;
      left: 12px;
      color: var(--text-secondary);
      pointer-events: none;
    }

    .search-input {
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.88);
      border: 1.5px solid rgba(47, 128, 237, 0.30);
      border-radius: var(--radius-pill);
      padding: 7px 14px 7px 34px;
      width: 220px;
      outline: none;
      transition: all 0.2s ease;
      box-shadow: 0 3px 10px -3px rgba(25, 55, 100, 0.10), inset 0 1px 2px rgba(25, 55, 100, 0.04);
    }

    .search-input::placeholder {
      color: var(--text-secondary);
      opacity: 0.72;
    }

    .search-input:hover {
      background: rgba(255, 255, 255, 0.96);
      border-color: rgba(47, 128, 237, 0.50);
    }

    .search-input:focus {
      background: #fff;
      border-color: #2f80ed;
      box-shadow: 0 0 0 3.5px rgba(47, 128, 237, 0.16), 0 4px 12px -3px rgba(47, 128, 237, 0.18);
      width: 250px;
    }

    .glass-toggle {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 13px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 2px 8px -2px rgba(25, 55, 100, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
      transition: all 0.18s ease;
    }

    .glass-toggle:hover {
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-primary);
    }

    .glass-toggle.active {
      background: rgba(235, 87, 87, 0.13);
      border-color: rgba(235, 87, 87, 0.30);
      color: #a32622;
    }

    .glass-toggle input {
      accent-color: #d64545;
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    .calendar-nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .student-search-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .student-search-wrap svg {
      position: absolute;
      left: 12px;
      color: var(--text-secondary);
      pointer-events: none;
    }

    .student-search-input {
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.88);
      border: 1.5px solid rgba(47, 128, 237, 0.30);
      border-radius: var(--radius-pill);
      padding: 7px 30px 7px 34px;
      width: 235px;
      outline: none;
      transition: all 0.2s ease;
      box-shadow: 0 3px 10px -3px rgba(25, 55, 100, 0.10), inset 0 1px 2px rgba(25, 55, 100, 0.04);
    }

    .student-search-input::placeholder {
      color: var(--text-secondary);
      opacity: 0.72;
    }

    .student-search-input:hover {
      background: rgba(255, 255, 255, 0.96);
      border-color: rgba(47, 128, 237, 0.50);
    }

    .student-search-input:focus {
      background: #fff;
      border-color: #2f80ed;
      box-shadow: 0 0 0 3.5px rgba(47, 128, 237, 0.16), 0 4px 12px -3px rgba(47, 128, 237, 0.18);
      width: 270px;
    }

    .clear-inline-btn {
      position: absolute;
      right: 7px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: none;
      background: rgba(20, 34, 56, 0.09);
      color: var(--text-secondary);
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .clear-inline-btn.visible {
      display: inline-flex;
    }

    .clear-inline-btn:hover {
      background: rgba(20, 34, 56, 0.18);
      color: var(--text-primary);
    }

    

    /* Main Weekly Calendar Glass Container */
    .calendar-panel {
      padding: 16px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Top Calendar Navigation Bar (for horizontal scroll arrows instead of bottom scrollbar) */
    .calendar-nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 2px;
    }

    .calendar-range-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .scroll-arrows {
      display: none;
      align-items: center;
      gap: 6px;
    }

    .scroll-arrows.visible {
      display: inline-flex;
    }

    .scroll-hint {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-right: 4px;
    }

    .scroll-arrow-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.92);
      background: rgba(255, 255, 255, 0.78);
      color: var(--text-primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px -4px rgba(25, 55, 100, 0.14), inset 0 1px 0 #fff;
      transition: all 0.18s ease;
    }

    .scroll-arrow-btn:hover:not(:disabled) {
      background: #fff;
      color: var(--accent-blue);
      transform: translateY(-1px);
      box-shadow: 0 8px 18px -5px rgba(47, 128, 237, 0.28);
    }

    .scroll-arrow-btn:disabled {
      opacity: 0.38;
      cursor: default;
      box-shadow: none;
    }

    /* Scroll viewport with bottom scrollbar hidden */
    .calendar-scroll {
      overflow-x: auto;
      overflow-y: visible;
      border-radius: 18px;
      scrollbar-width: none;
      -ms-overflow-style: none;
      scroll-behavior: smooth;
    }

    .calendar-scroll::-webkit-scrollbar {
      display: none;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: 74px repeat(var(--day-cols, 5), minmax(210px, 1fr));
      min-width: calc(74px + var(--day-cols, 5) * 210px);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.36);
      border: 1px solid rgba(255, 255, 255, 0.78);
      overflow: visible;
    }

    .cal-corner {
      position: sticky;
      left: 0;
      z-index: 5;
      padding: 14px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      background: rgba(244, 249, 255, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(20, 45, 85, 0.06);
      border-right: 1px solid rgba(20, 45, 85, 0.08);
      border-top-left-radius: 18px;
    }

    .cal-day-header {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(255, 255, 255, 0.54);
      border-bottom: 1px solid rgba(20, 45, 85, 0.06);
      border-right: 1px solid rgba(20, 45, 85, 0.05);
    }

    .cal-day-header:last-child {
      border-right: none;
      border-top-right-radius: 18px;
    }

    .cal-day-header.is-today {
      background: linear-gradient(180deg, rgba(47, 128, 237, 0.18) 0%, rgba(47, 128, 237, 0.08) 100%);
      border-bottom-color: rgba(47, 128, 237, 0.28);
      box-shadow: inset 0 2px 0 #2f80ed;
    }

    .cal-day-header.is-today .day-weekday,
    .cal-day-header.is-today .day-date {
      color: #1659b8;
    }

    .today-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: var(--radius-pill);
      background: #2f80ed;
      color: #fff;
      box-shadow: 0 4px 10px -2px rgba(47, 128, 237, 0.45);
    }

    .day-header-badges {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .cal-slot-cell.is-today {
      background: rgba(47, 128, 237, 0.055);
      border-right-color: rgba(47, 128, 237, 0.10);
    }

    .mini-day.is-today {
      background: linear-gradient(145deg, #4b9bff, #2f80ed);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.85);
      box-shadow: 0 4px 10px -2px rgba(47, 128, 237, 0.45);
    }

    .mini-day.is-today::after {
      background: #fff;
    }

    .day-title-group {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .day-weekday {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .day-date {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .day-count-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.95);
      color: var(--text-secondary);
      box-shadow: 0 2px 6px rgba(25, 55, 100, 0.05);
    }

    .day-count-badge.has-items {
      color: var(--accent-blue);
      background: rgba(47, 128, 237, 0.10);
      border-color: rgba(47, 128, 237, 0.18);
    }

    /* Time Rows (sticky left time column) */
    .cal-time-cell {
      position: sticky;
      left: 0;
      z-index: 4;
      padding: 12px 10px 10px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-start;
      border-bottom: 1px solid rgba(20, 45, 85, 0.05);
      border-right: 1px solid rgba(20, 45, 85, 0.08);
      background: rgba(242, 248, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .cal-time-label {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }

    .cal-time-sub {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .cal-slot-cell {
      padding: 7px;
      border-bottom: 1px solid rgba(20, 45, 85, 0.05);
      border-right: 1px solid rgba(20, 45, 85, 0.045);
      display: flex;
      align-items: stretch;
      min-height: 112px;
      transition: background 0.18s ease;
    }

    .cal-slot-cell.row-empty {
      min-height: 44px;
      padding: 4px 7px;
    }

    .cal-time-cell.row-empty {
      padding: 8px 10px;
      justify-content: center;
    }

    .cal-time-cell.row-empty .cal-time-sub {
      display: none;
    }

    /* Glassmorphic Event Cards */
    .banca-card {
      width: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 7px;
      padding: 10px 11px 10px 13px;
      border-radius: 13px;
      background: var(--card-bg, rgba(227, 242, 255, 0.68));
      backdrop-filter: blur(14px) saturate(145%);
      -webkit-backdrop-filter: blur(14px) saturate(145%);
      border: 1px solid rgba(255, 255, 255, 0.84);
      box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.85);
      cursor: pointer;
      transition: transform 0.22s cubic-bezier(0.2, 0.85, 0.25, 1),
                  box-shadow 0.22s cubic-bezier(0.2, 0.85, 0.25, 1),
                  background 0.22s ease;
      text-align: left;
      overflow: hidden;
    }

    .banca-card::before {
      content: "";
      position: absolute;
      left: 5px;
      top: 9px;
      bottom: 9px;
      width: 3.5px;
      border-radius: 99px;
      background: var(--card-accent, #2f80ed);
      transition: all 0.22s ease;
    }

    .banca-card:hover {
      transform: translateY(-3px) scale(1.012);
      background: var(--card-bg-elevated, rgba(214, 236, 255, 0.90));
      box-shadow: 0 16px 30px -10px var(--card-shadow-color, rgba(47, 128, 237, 0.34)),
                  0 4px 10px -3px rgba(20, 45, 85, 0.08),
                  inset 0 1px 1px rgba(255, 255, 255, 0.95);
      z-index: 3;
    }

    .banca-card.highlighted {
      background: var(--card-bg-elevated, rgba(214, 236, 255, 0.86));
      border-color: rgba(255, 255, 255, 0.95);
      box-shadow: 0 14px 26px -10px var(--card-shadow-color, rgba(47, 128, 237, 0.34)),
                  0 4px 10px -2px rgba(20, 45, 85, 0.07),
                  inset 0 1.5px 0 rgba(255, 255, 255, 0.95);
    }

    .banca-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-left: 5px;
    }

    .banca-time {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--card-accent-dark, #1d5fb8);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
    }

    .banca-badges {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .mini-badge {
      font-size: 9.5px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: var(--radius-pill);
      letter-spacing: 0.02em;
    }

    .badge-closed {
      background: rgba(235, 87, 87, 0.14);
      color: #b92b27;
      border: 1px solid rgba(235, 87, 87, 0.22);
    }

    .badge-confirm {
      background: rgba(242, 153, 74, 0.16);
      color: #a85a12;
      border: 1px solid rgba(242, 153, 74, 0.25);
    }

    .banca-title {
      padding-left: 5px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text-primary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .banca-student {
      padding-left: 5px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .banca-profs {
      padding-left: 5px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 2px;
    }

    .prof-name-line {
      font-size: 10.5px;
      font-weight: 500;
      color: var(--text-secondary);
      line-height: 1.25;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.56);
      border: 1px solid rgba(255, 255, 255, 0.72);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .prof-name-line.is-selected {
      background: var(--card-accent, #2f80ed);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.45);
      font-weight: 600;
    }

    .prof-name-line.needs-confirm::after {
      content: " (confirmar)";
      font-size: 9.5px;
      opacity: 0.75;
    }

    /* Empty state when a week has 0 bancas for selected professor */
    .empty-week-banner {
      margin-top: 6px;
      padding: 24px 20px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.9);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .empty-week-banner p {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .btn-glass-primary {
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(145deg, #4398ff, #2f80ed);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: var(--radius-pill);
      padding: 8px 16px;
      cursor: pointer;
      box-shadow: 0 8px 18px -6px rgba(47, 128, 237, 0.45);
      transition: transform 0.16s ease;
    }

    .btn-glass-primary:hover {
      transform: translateY(-1px);
    }

    /* Drag-and-drop full-screen frosted overlay */
    .drop-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(215, 236, 255, 0.72);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .drop-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .drop-box {
      padding: 40px 56px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.85);
      border: 2px dashed #2f80ed;
      box-shadow: 0 28px 60px -18px rgba(32, 68, 120, 0.25);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: var(--text-primary);
    }

    .drop-box strong {
      font-size: 18px;
    }

    .drop-box span {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* Toast feedback */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 150;
      padding: 12px 18px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.98);
      box-shadow: 0 18px 36px -10px rgba(20, 48, 92, 0.22);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
      transform: translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* Modal Detail View */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(20, 40, 72, 0.22);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: 100%;
      max-width: 540px;
      padding: 24px 26px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.96);
      box-shadow: 0 30px 70px -15px rgba(20, 48, 92, 0.28), inset 0 1px 0 #fff;
      transform: translateY(10px) scale(0.98);
      transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-backdrop.open .modal-card {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-time-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      background: rgba(47, 128, 237, 0.12);
      color: #1659b8;
      font-size: 12.5px;
      font-weight: 700;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(20, 45, 85, 0.08);
      background: rgba(255, 255, 255, 0.85);
      color: var(--text-secondary);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .modal-close:hover {
      background: #fff;
      color: var(--text-primary);
    }

    .modal-title {
      font-size: 19px;
      font-weight: 700;
      line-height: 1.32;
      color: var(--text-primary);
      letter-spacing: -0.015em;
    }

    .modal-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(240, 246, 255, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.9);
    }

    .modal-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .modal-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .modal-profs-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 2px;
    }

    .modal-prof-chip {
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(47, 128, 237, 0.22);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.16s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .modal-prof-chip:hover {
      background: #2f80ed;
      color: #fff;
      border-color: #2f80ed;
    }

    .import-option-box {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 13px 15px;
      border-radius: 15px;
      background: rgba(240, 246, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.95);
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .import-option-box:hover {
      background: rgba(232, 242, 255, 0.92);
      border-color: rgba(47, 128, 237, 0.28);
    }

    .import-option-box input {
      margin-top: 2px;
      width: 16px;
      height: 16px;
      accent-color: #2f80ed;
      cursor: pointer;
      flex-shrink: 0;
    }

    .import-option-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .import-option-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .import-option-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 4px;
    }

    .btn-glass-secondary {
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(20, 45, 85, 0.10);
      border-radius: var(--radius-pill);
      padding: 8px 16px;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .btn-glass-secondary:hover {
      background: #fff;
      color: var(--text-primary);
    }

    @media (max-width: 1024px) {
      .top-bar {
        grid-template-columns: 1fr;
      }
      .mini-cal-card {
        display: none;
      }
    }

    @media (max-width: 720px) {
      .app-shell {
        padding: 12px 10px 28px;
      }
      .header-main, .pills-panel, .calendar-panel {
        padding: 14px;
      }
      .search-input {
        width: 160px;
      }
      .search-input:focus {
        width: 185px;
      }
    }
  </style>
</head>
<body>
  <div class="ambient-bg" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Drag & Drop Overlay -->
  <div class="drop-overlay" id="dropOverlay">
    <div class="drop-box">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#2f80ed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
      <strong>Solte a planilha (.xlsx) aqui</strong>
      <span>O calendário e os filtros serão atualizados automaticamente no navegador</span>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <main class="app-shell">
    <!-- Top Header + Mini Calendar -->
    <section class="top-bar">
      <header class="glass-panel header-main">
        <div class="header-top-row">
          <div class="brand">
            <div class="brand-icon" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="4"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
            </div>
            <div class="brand-text">
              <h1>Bancas TCC Design</h1>
              <div class="brand-subtitle">
                <span id="dateSpanText">30 Nov – 09 Dez 2026</span>
                <span class="status-chip" id="summaryChip">
                  <span class="status-dot"></span>
                  <span id="summaryText">67 bancas</span>
                </span>
                <span class="source-file-tag" id="sourceFileTag"></span>
              </div>
            </div>
          </div>

          <div class="upload-group">
            <input type="file" id="xlsxFileInput" accept=".xlsx" hidden />
            <button type="button" class="upload-btn" id="uploadBtn" title="Carregar uma nova planilha .xlsx">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
              <span>Subir planilha (.xlsx)</span>
            </button>
            <button type="button" class="reset-source-btn" id="resetSourceBtn" style="display: none;">Restaurar original</button>
          </div>
        </div>
      </header>

      <aside class="glass-panel mini-cal-card" aria-label="Mini calendário">
        <div class="mini-cal-header">
          <span id="miniCalMonthLabel">Nov / Dez 2026</span>
          <span class="mini-cal-badge">Bancas</span>
        </div>
        <div class="mini-cal-grid" id="miniCalGrid"></div>
      </aside>
    </section>

    <!-- Search Toolbar: Professor e Estudante -->
    <section class="glass-panel search-bar-panel" aria-label="Busca de bancas">
      <div class="search-inputs-group">
        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" class="search-input" id="profSearchInput" placeholder="Buscar professor..." />
          <button type="button" class="clear-inline-btn" id="clearProfSearchBtn" aria-label="Limpar busca de professor">×</button>
        </div>

        <div class="student-search-wrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" class="student-search-input" id="studentSearchInput" placeholder="Buscar estudante..." />
          <button type="button" class="clear-inline-btn" id="clearStudentSearchBtn" aria-label="Limpar busca de estudante">×</button>
        </div>

        <div id="activeFilterBanner" class="active-filter-banner" style="display: none;">
          <span id="activeFilterName"></span>
          <button class="clear-filter-btn" id="clearFilterBtn" title="Limpar filtro de professor" aria-label="Limpar filtro">×</button>
        </div>
      </div>
    </section>

    <!-- Weekly Calendar Grid -->
    <section class="glass-panel calendar-panel" aria-label="Calendário semanal de bancas">
      <div class="calendar-nav-bar">
        <div class="calendar-range-label" id="calendarRangeLabel"></div>
        <div class="scroll-arrows" id="scrollArrows">
          <span class="scroll-hint">Rolar dias</span>
          <button type="button" class="scroll-arrow-btn" id="scrollLeftBtn" aria-label="Rolar para a esquerda" title="Rolar para a esquerda">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <button type="button" class="scroll-arrow-btn" id="scrollRightBtn" aria-label="Rolar para a direita" title="Rolar para a direita">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>
      </div>

      <div class="calendar-scroll" id="calendarScroll">
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>

      <div class="empty-week-banner" id="emptyWeekBanner" style="display: none;">
        <p id="emptyWeekMsg"></p>
      </div>
    </section>
  </main>

  <!-- Detail Modal -->
  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card" id="modalCard">
      <div class="modal-header">
        <div class="modal-time-pill" id="modalTimePill"></div>
        <button class="modal-close" id="modalCloseBtn" aria-label="Fechar detalhes">×</button>
      </div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <div class="modal-section">
        <span class="modal-label">Estudante</span>
        <span class="modal-value" id="modalStudent"></span>
      </div>
      <div class="modal-section">
        <span class="modal-label">Banca examinadora (clique para filtrar)</span>
        <div class="modal-profs-list" id="modalProfsList"></div>
      </div>
    </div>
  </div>

  <!-- Import Options Modal -->
  <div class="modal-backdrop" id="importModalBackdrop" role="dialog" aria-modal="true" aria-labelledby="importModalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-time-pill">Importar planilha</div>
        <button class="modal-close" id="importCloseBtn" aria-label="Cancelar importação">×</button>
      </div>
      <h2 class="modal-title" id="importModalTitle"></h2>
      <div class="modal-section">
        <span class="modal-label">Resumo encontrado</span>
        <span class="modal-value" id="importSummaryText"></span>
      </div>
      <label class="import-option-box">
        <input type="checkbox" id="importOmitClosedCheckbox" checked />
        <div class="import-option-text">
          <span class="import-option-title">Omitir bancas fechadas</span>
          <span class="import-option-desc" id="importOmitClosedDesc">Remove as bancas fechadas desta importação para que não sejam exibidas nem salvas no navegador.</span>
        </div>
      </label>
      <div class="modal-actions">
        <button type="button" class="btn-glass-secondary" id="importCancelBtn">Cancelar</button>
        <button type="button" class="btn-glass-primary" id="importConfirmBtn">Importar calendário</button>
      </div>
    </div>

    // ---------------- Client-Side Zero-Dependency XLSX Parser ----------------
    async function unzipXlsxXmlFiles(arrayBuffer) {
      const bytes = new Uint8Array(arrayBuffer);
      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      let eocd = -1;
      for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
        if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
      }
      if (eocd < 0) throw new Error("Arquivo inválido. Envie uma planilha .xlsx válida.");
      const cdOffset = view.getUint32(eocd + 16, true);
      const totalEntries = view.getUint16(eocd + 10, true);
      const dec = new TextDecoder("utf-8");
      const files = {};
      let ptr = cdOffset;
      for (let i = 0; i < totalEntries; i++) {
        if (view.getUint32(ptr, true) !== 0x02014b50) break;
        const compMethod = view.getUint16(ptr + 10, true);
        const compSize = view.getUint32(ptr + 20, true);
        const nameLen = view.getUint16(ptr + 28, true);
        const extraLen = view.getUint16(ptr + 30, true);
        const commentLen = view.getUint16(ptr + 32, true);
        const localHeaderOffset = view.getUint32(ptr + 42, true);
        const name = dec.decode(bytes.subarray(ptr + 46, ptr + 46 + nameLen));
        ptr += 46 + nameLen + extraLen + commentLen;

        if (!name.endsWith(".xml") && !name.endsWith(".rels")) continue;
        const lhNameLen = view.getUint16(localHeaderOffset + 26, true);
        const lhExtraLen = view.getUint16(localHeaderOffset + 28, true);
        const dataStart = localHeaderOffset + 30 + lhNameLen + lhExtraLen;
        const compData = bytes.subarray(dataStart, dataStart + compSize);
        if (compMethod === 0) {
          files[name] = dec.decode(compData);
        } else if (compMethod === 8) {
          const ds = new DecompressionStream("deflate-raw");
          const writer = ds.writable.getWriter();
          writer.write(compData);
          writer.close();
          const outBuf = await new Response(ds.readable).arrayBuffer();
          files[name] = dec.decode(outBuf);
        }
      }
      return files;
    }

    function colToIdx(col) {
      let idx = 0;
      for (let i = 0; i < col.length; i++) idx = idx * 26 + (col.charCodeAt(i) - 64);
      return idx;
    }

    function idxToCol(idx) {
      let res = "";
      while (idx > 0) {
        const rem = (idx - 1) % 26;
        res = String.fromCharCode(65 + rem) + res;
        idx = Math.floor((idx - 1) / 26);
      }
      return res;
    }

    function getIsoWeekKey(dateStr) {
      const [y, m, d] = dateStr.split("-").map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d));
      const dayNum = dt.getUTCDay() || 7;
      dt.setUTCDate(dt.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(dt.getUTCFullYear(), 0, 1));
      const weekNo = Math.ceil((((dt - yearStart) / 86400000) + 1) / 7);
      return `${dt.getUTCFullYear()}-W${String(weekNo).padStart(2, "0")}`;
    }

    function stripPrefixJs(text, prefixes) {
      const s = String(text || "").replace(/\s+/g, " ").trim();
      for (const p of prefixes) {
        if (s.toLowerCase().startsWith(p.toLowerCase())) {
          return s.slice(p.length).trim();
        }
      }
      return s;
    }

    function cleanStudentNameJs(name) {
      if (!name) return "";
      const letters = name.match(/[A-Za-zÀ-ÖØ-öø-ÿ]/g) || [];
      const uppers = letters.filter(c => c === c.toUpperCase() && c !== c.toLowerCase());
      if (letters.length && uppers.length / letters.length > 0.85) {
        const lowerWords = new Set(["da", "de", "do", "das", "dos", "e"]);
        return name.split(/\s+/).map((w, i) => {
          const lw = w.toLowerCase();
          if (i > 0 && lowerWords.has(lw)) return lw;
          return lw.charAt(0).toUpperCase() + lw.slice(1);
        }).join(" ");
      }
      return name;
    }

    function canonicalizeProfessorJs(raw) {
      const cleaned = String(raw || "").replace(/\s+/g, " ").trim();
      if (!cleaned || cleaned === "–" || cleaned === "-" || cleaned === "—") return null;
      const needsConfirm = /confirmar/i.test(cleaned) || cleaned.includes("?");
      const key = normKeyProf(cleaned);
      if (!key) return null;
      let canonical = ALIASES[key];
      if (!canonical) {
        canonical = cleaned.replace(/\s*\(confirmar\)\s*/gi, "").replace(/^[?\s–-]+|[?\s–-]+$/g, "");
      }
      return { name: canonical, needsConfirm, raw: cleaned, key };
    }

    async function parseXlsxBuffer(arrayBuffer, fileName) {
      const files = await unzipXlsxXmlFiles(arrayBuffer);
      const parser = new DOMParser();

      const sst = [];
      if (files["xl/sharedStrings.xml"]) {
        const sstDoc = parser.parseFromString(files["xl/sharedStrings.xml"], "application/xml");
        const sis = sstDoc.getElementsByTagNameNS("*", "si");
        for (let i = 0; i < sis.length; i++) {
          const ts = sis[i].getElementsByTagNameNS("*", "t");
          let str = "";
          for (let j = 0; j < ts.length; j++) str += ts[j].textContent || "";
          sst.push(str);
        }
      }

      // Find first sheet XML
      let sheetPath = "xl/worksheets/sheet1.xml";
      if (!files[sheetPath]) {
        sheetPath = Object.keys(files).find(k => k.startsWith("xl/worksheets/sheet") && k.endsWith(".xml"));
      }
      if (!sheetPath || !files[sheetPath]) {
        throw new Error("Planilha não encontrada dentro do arquivo .xlsx.");
      }

      const wsDoc = parser.parseFromString(files[sheetPath], "application/xml");
      const rows = wsDoc.getElementsByTagNameNS("*", "row");
      const grid = new Map();
      let maxRow = 0;
      let maxCol = 0;

      for (let i = 0; i < rows.length; i++) {
        const rIdx = Number(rows[i].getAttribute("r"));
        if (rIdx > maxRow) maxRow = rIdx;
        const cells = rows[i].getElementsByTagNameNS("*", "c");
        for (let j = 0; j < cells.length; j++) {
          const c = cells[j];
          const ref = c.getAttribute("r") || "";
          const m = ref.match(/^([A-Z]+)(\d+)$/);
          if (!m) continue;
          const col = m[1];
          const r = Number(m[2]);
          const ci = colToIdx(col);
          if (ci > maxCol) maxCol = ci;
          const t = c.getAttribute("t");
          const vEl = c.getElementsByTagNameNS("*", "v")[0];
          const isEl = c.getElementsByTagNameNS("*", "is")[0];
          let val = null;
          if (vEl) {
            val = t === "s" ? sst[Number(vEl.textContent)] : vEl.textContent;
          } else if (isEl) {
            const ts = isEl.getElementsByTagNameNS("*", "t");
            val = "";
            for (let k = 0; k < ts.length; k++) val += ts[k].textContent || "";
          }
          if (val !== null && val !== undefined) {
            grid.set(`${col}:${r}`, val);
          }
        }
      }

      const days = [];
      const isoWeekMap = new Map();
      for (let ci = 2; ci <= maxCol; ci++) {
        const col = idxToCol(ci);
        const rawVal = String(grid.get(`${col}:1`) || "").trim();
        let dtObj = null;
        if (/^\d+(\.\d+)?$/.test(rawVal) && Number(rawVal) >= 30000) {
          const serial = Math.floor(Number(rawVal));
          dtObj = new Date(Date.UTC(1899, 11, 30 + serial));
        } else if (/^\d{2}\/\d{2}\/\d{4}$/.test(rawVal)) {
          const [dd, mm, yyyy] = rawVal.split("/").map(Number);
          dtObj = new Date(Date.UTC(yyyy, mm - 1, dd));
        } else if (/^\d{4}-\d{2}-\d{2}$/.test(rawVal)) {
          const [yyyy, mm, dd] = rawVal.split("-").map(Number);
          dtObj = new Date(Date.UTC(yyyy, mm - 1, dd));
        }
        if (!dtObj) continue;

        const yyyy = dtObj.getUTCFullYear();
        const mm = dtObj.getUTCMonth() + 1;
        const dd = dtObj.getUTCDate();
        const dateStr = `${yyyy}-${String(mm).padStart(2, "0")}-${String(dd).padStart(2, "0")}`;
        const nextCol = idxToCol(ci + 1);
        const weekday = String(grid.get(`${nextCol}:1`) || "").trim() || WEEKDAY_NAMES_JS[dtObj.getUTCDay()];
        const wKey = getIsoWeekKey(dateStr);
        if (!isoWeekMap.has(wKey)) isoWeekMap.set(wKey, isoWeekMap.size + 1);
        const weekNum = isoWeekMap.get(wKey);

        days.push({
          col,
          date: dateStr,
          dayNum: dd,
          month: mm,
          year: yyyy,
          monthLabel: MONTH_PT[mm],
          weekday,
          weekdayShort: WEEKDAY_SHORT[weekday] || weekday.slice(0, 3),
          weekNum,
          label: `${WEEKDAY_SHORT[weekday] || weekday.slice(0, 3)} · ${String(dd).padStart(2, "0")} ${MONTH_PT[mm]}`,
        });
      }

      if (!days.length) {
        throw new Error("Não foram encontradas datas na linha 1 da planilha.");
      }

      const hours = [];
      for (let r = 3; r <= maxRow; r++) {
        const a = String(grid.get(`A:${r}`) || "").trim();
        if (a) {
          const m = a.match(/^(\d+)/);
          if (m) {
            const hInt = Number(m[1]);
            hours.push({ row: r, hour: hInt, start: `${String(hInt).padStart(2, "0")}:00`, end: `${String(hInt + 1).padStart(2, "0")}:00` });
          }
        }
      }

      if (!hours.length) {
        throw new Error("Não foram encontrados horários na coluna A da planilha.");
      }

      // First pass: collect all unknown professor names to auto-merge subset names if new variations appear
      const rawBancas = [];
      const seenCanonicalKeys = new Map();
      for (const h of hours) {
        for (const d of days) {
          const c = d.col;
          const vals = [0, 1, 2, 3, 4, 5].map(i => grid.get(`${c}:${h.row + i}`) || "");
          const tituloRaw = stripPrefixJs(vals[0], ["Titulo:", "Título:"]);
          const alunoRaw = stripPrefixJs(vals[1], ["Nome do aluno:"]);
          const profRaws = [
            stripPrefixJs(vals[2], ["Nome do orientador:"]),
            stripPrefixJs(vals[3], ["Convidado 01:"]),
            stripPrefixJs(vals[4], ["Convidado 02:"]),
          ];
          const salaRaw = stripPrefixJs(vals[5], ["Sala:"]);
          const parsedProfs = profRaws.map(canonicalizeProfessorJs).filter(Boolean);
          if (!tituloRaw && !alunoRaw && !parsedProfs.length && !salaRaw) continue;

          for (const p of parsedProfs) {
            if (!seenCanonicalKeys.has(p.key)) seenCanonicalKeys.set(p.key, p.name);
          }
          rawBancas.push({ h, d, tituloRaw, alunoRaw, parsedProfs, salaRaw });
        }
      }

      // Auto-merge new accent/shortened variants when one key's tokens are subset of a unique fuller name sharing first & last token
      const allKeys = Array.from(seenCanonicalKeys.keys());
      const dynamicMerge = new Map();
      for (const shortK of allKeys) {
        if (ALIASES[shortK]) continue;
        const st = shortK.split(" ");
        if (st.length < 2) continue;
        const candidates = allKeys.filter(longK => {
          if (longK === shortK) return false;
          const lt = longK.split(" ");
          if (lt.length <= st.length) return false;
          return st[0] === lt[0] && st[st.length - 1] === lt[lt.length - 1] && st.every(tok => lt.includes(tok));
        });
        if (candidates.length === 1) {
          dynamicMerge.set(shortK, seenCanonicalKeys.get(candidates[0]));
        }
      }

      const profCounter = new Map();
      const bancas = rawBancas.map((item, idx) => {
        const professors = [];
        const seenInBanca = new Set();
        for (const p of item.parsedProfs) {
          const finalName = dynamicMerge.get(p.key) || p.name;
          if (!seenInBanca.has(finalName)) {
            seenInBanca.add(finalName);
            professors.push({ name: finalName, needsConfirm: p.needsConfirm, raw: p.raw });
            profCounter.set(finalName, (profCounter.get(finalName) || 0) + 1);
          }
        }
        const isClosed = /banca\s*fechada/i.test(item.tituloRaw);
        let cleanTitle = item.tituloRaw.replace(/^\s*\(?\s*banca\s*fechada\s*\)?\s*[-–:]?\s*/i, "").trim();
        if (!cleanTitle && isClosed) cleanTitle = "Banca Fechada";

        return {
          id: `banca-${idx + 1}`,
          date: item.d.date,
          weekNum: item.d.weekNum,
          hour: item.h.hour,
          startTime: item.h.start,
          endTime: item.h.end,
          title: cleanTitle || "Sem título informado",
          student: cleanStudentNameJs(item.alunoRaw),
          professors,
          isClosed,
          sala: item.salaRaw,
        };
      });

      const professorsList = Array.from(profCounter.entries())
        .map(([name, count]) => ({ name, count }))
        .sort((a, b) => (b.count - a.count) || a.name.localeCompare(b.name, "pt-BR"));

      return {
        sourceName: fileName,
        isCustomUpload: true,
        days,
        hours: hours.map(h => ({ hour: h.hour, start: h.start, end: h.end })),
        bancas,
        professors: professorsList,
      };
    }

    function openImportModal(parsed) {
      pendingImportData = parsed;
      const totalCnt = parsed.bancas.length;
      const closedCnt = parsed.bancas.filter(b => b.isClosed).length;
      importModalTitle.textContent = parsed.sourceName;
      importSummaryText.textContent = `${totalCnt} bancas encontradas · ${closedCnt} ${closedCnt === 1 ? "banca fechada" : "bancas fechadas"} · ${parsed.professors.length} professores`;
      importOmitClosedCheckbox.checked = true;
      importOmitClosedDesc.textContent = closedCnt > 0
        ? `Remove ${closedCnt} ${closedCnt === 1 ? "banca fechada" : "bancas fechadas"} desta importação para que não ${closedCnt === 1 ? "seja exibida nem salva" : "sejam exibidas nem salvas"}.`
        : "Nenhuma banca fechada detectada nesta planilha.";
      importModalBackdrop.classList.add("open");
    }

    function closeImportModal() {
      pendingImportData = null;
      importModalBackdrop.classList.remove("open");
    }

    function applyImportedSchedule() {
      if (!pendingImportData) return;
      const omitClosed = importOmitClosedCheckbox.checked;
      const raw = pendingImportData;
      const finalBancas = omitClosed ? raw.bancas.filter(b => !b.isClosed) : raw.bancas;
      const finalProfs = getProfessorListFromBase(finalBancas);
      const closedOmitted = raw.bancas.length - finalBancas.length;

      const finalData = {
        ...raw,
        bancas: finalBancas,
        professors: finalProfs,
      };

      closeImportModal();
      SCHEDULE_DATA = finalData;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(finalData)); } catch (e) {}
      state.selectedProfessor = null;
      state.profQuery = "";
      state.studentQuery = "";
      profSearchInput.value = "";
      studentSearchInput.value = "";
      clearProfSearchBtn.classList.remove("visible");
      clearStudentSearchBtn.classList.remove("visible");
      rebuildColorMap();
      render();

      const omittedMsg = closedOmitted > 0 ? ` (${closedOmitted} fechadas omitidas)` : "";
      showToast(`Planilha importada: ${finalData.bancas.length} bancas · ${finalData.professors.length} professores${omittedMsg}`);
    }

    async function handleUploadedFile(file) {
      if (!file) return;
      if (!file.name.toLowerCase().endsWith(".xlsx")) {
        showToast("Por favor, envie um arquivo .xlsx.");
        return;
      }
      try {
        const buf = await file.arrayBuffer();
        const parsed = await parseXlsxBuffer(buf, file.name);
        openImportModal(parsed);
      } catch (err) {
        console.error(err);
        showToast(err.message || "Erro ao processar planilha.");
      }
    }

    // ---------------- UI Rendering ----------------
    function getBaseBancas() {
      return SCHEDULE_DATA.bancas;
    }

    function getFilteredBancas() {
      const sq = normText(state.studentQuery.trim());
      const pq = normText(state.profQuery.trim());
      return getBaseBancas().filter(b => {
        if (state.selectedProfessor && !b.professors.some(p => p.name === state.selectedProfessor)) {
          return false;
        }
        if (pq && !b.professors.some(p => normText(p.name).includes(pq))) {
          return false;
        }
        if (sq && !normText(b.student).includes(sq)) {
          return false;
        }
        return true;
      });
    }

    function getProfessorListFromBase(baseBancas) {
      const counts = new Map();
      for (const b of baseBancas) {
        for (const p of b.professors) {
          counts.set(p.name, (counts.get(p.name) || 0) + 1);
        }
      }
      return Array.from(counts.entries())
        .map(([name, count]) => ({ name, count }))
        .sort((a, b) => (b.count - a.count) || a.name.localeCompare(b.name, "pt-BR"));
    }

    function selectProfessor(profName) {
      if (state.selectedProfessor === profName) {
        state.selectedProfessor = null;
      } else {
        state.selectedProfessor = profName;
      }
      render();
    }

    function renderHeaderMeta(filteredBancas) {
      if (SCHEDULE_DATA.days.length) {
        const first = SCHEDULE_DATA.days[0];
        const last = SCHEDULE_DATA.days[SCHEDULE_DATA.days.length - 1];
        dateSpanText.textContent = `${String(first.dayNum).padStart(2, "0")} ${first.monthLabel} – ${String(last.dayNum).padStart(2, "0")} ${last.monthLabel} ${last.year || 2026}`;
      }

      const all = filteredBancas.length;
      const terms = [];
      if (state.selectedProfessor) terms.push(state.selectedProfessor);
      else if (state.profQuery.trim()) terms.push(`prof. "${state.profQuery.trim()}"`);
      if (state.studentQuery.trim()) terms.push(`estudante "${state.studentQuery.trim()}"`);

      if (terms.length) {
        summaryText.textContent = `${all} ${all === 1 ? "banca" : "bancas"} (${terms.join(" · ")})`;
      } else {
        summaryText.textContent = `${all} ${all === 1 ? "banca" : "bancas"} no total`;
      }

      if (state.selectedProfessor) {
        activeFilterBanner.style.display = "inline-flex";
        activeFilterName.textContent = state.selectedProfessor;
      } else {
        activeFilterBanner.style.display = "none";
      }



      if (SCHEDULE_DATA.isCustomUpload) {
        sourceFileTag.textContent = `Planilha: ${SCHEDULE_DATA.sourceName}`;
        resetSourceBtn.style.display = "inline-flex";
      } else {
        sourceFileTag.textContent = "";
        resetSourceBtn.style.display = "none";
      }
    }



    function renderMiniCalendar(filteredBancas) {
      if (!SCHEDULE_DATA.days.length) return;
      const todayIso = getTodayIso();
      const activeDates = new Set(filteredBancas.map(b => b.date));
      const allBancaDates = new Set(getBaseBancas().map(b => b.date));

      const firstParts = SCHEDULE_DATA.days[0].date.split("-").map(Number);
      const lastParts = SCHEDULE_DATA.days[SCHEDULE_DATA.days.length - 1].date.split("-").map(Number);
      const startDt = new Date(Date.UTC(firstParts[0], firstParts[1] - 1, firstParts[2]));
      const startDow = (startDt.getUTCDay() + 6) % 7;
      startDt.setUTCDate(startDt.getUTCDate() - startDow);

      const endDt = new Date(Date.UTC(lastParts[0], lastParts[1] - 1, lastParts[2]));
      const endDow = (endDt.getUTCDay() + 6) % 7;
      endDt.setUTCDate(endDt.getUTCDate() + (6 - endDow));

      const monthsSeen = Array.from(new Set(SCHEDULE_DATA.days.map(d => d.monthLabel)));
      const yr = SCHEDULE_DATA.days[0].year || Number(SCHEDULE_DATA.days[0].date.slice(0, 4));
      miniCalMonthLabel.textContent = `${monthsSeen.join(" / ")} ${yr}`;

      const headers = ["S", "T", "Q", "Q", "S", "S", "D"];
      let html = headers.map(h => `<div class="mini-wd">${h}</div>`).join("");

      for (let cur = new Date(startDt); cur <= endDt; cur.setUTCDate(cur.getUTCDate() + 1)) {
        const y = cur.getUTCFullYear();
        const m = cur.getUTCMonth() + 1;
        const d = cur.getUTCDate();
        const iso = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

        const hasAny = allBancaDates.has(iso);
        const hasFiltered = activeDates.has(iso);
        const dayObj = SCHEDULE_DATA.days.find(x => x.date === iso);

        const classes = ["mini-day"];
        if (hasAny) classes.push("has-banca");
        if (hasAny) classes.push("in-active-week");
        if (iso === todayIso) classes.push("is-today");
        if (hasAny && !hasFiltered) classes.push("empty-for-filter");

        html += `<button type="button" class="${classes.join(" ")}" data-date="${iso}" title="${dayObj ? dayObj.label : ""}">${d}</button>`;
      }

      miniCalGrid.innerHTML = html;
      miniCalGrid.querySelectorAll("[data-date]").forEach(el => {
        el.addEventListener("click", () => {
          const targetDay = document.querySelector(`.cal-day-header[data-date="${el.dataset.date}"]`);
          if (targetDay) {
            targetDay.scrollIntoView({ behavior: "smooth", inline: "start", block: "nearest" });
          }
        });
      });
    }



    function updateScrollArrows() {
      const canScroll = calendarScroll.scrollWidth > calendarScroll.clientWidth + 4;
      scrollArrows.classList.toggle("visible", canScroll);
      if (canScroll) {
        scrollLeftBtn.disabled = calendarScroll.scrollLeft <= 4;
        scrollRightBtn.disabled = calendarScroll.scrollLeft + calendarScroll.clientWidth >= calendarScroll.scrollWidth - 4;
      }
    }

    function renderCalendar(filteredBancas) {
      const visibleDays = SCHEDULE_DATA.days;

      if (visibleDays.length) {
        const f = visibleDays[0];
        const l = visibleDays[visibleDays.length - 1];
        calendarRangeLabel.textContent = `Cronograma completo (${visibleDays.length} dias) · ${String(f.dayNum).padStart(2, "0")} ${f.monthLabel} a ${String(l.dayNum).padStart(2, "0")} ${l.monthLabel}`;
      }

      calendarGrid.style.setProperty("--day-cols", Math.max(visibleDays.length, 1));

      const slotMap = new Map();
      const dayCounts = new Map();
      visibleDays.forEach(d => dayCounts.set(d.date, 0));

      for (const b of filteredBancas) {
        if (dayCounts.has(b.date)) {
          dayCounts.set(b.date, dayCounts.get(b.date) + 1);
          slotMap.set(`${b.date}_${b.hour}`, b);
        }
      }

      const todayIso = getTodayIso();
      let html = `<div class="cal-corner">Horário</div>`;
      for (const d of visibleDays) {
        const cnt = dayCounts.get(d.date) || 0;
        const isToday = d.date === todayIso;
        html += `
          <div class="cal-day-header ${isToday ? "is-today" : ""}" data-date="${d.date}">
            <div class="day-title-group">
              <span class="day-weekday">${escapeHtml(d.weekday)}</span>
              <span class="day-date">${String(d.dayNum).padStart(2, "0")} ${escapeHtml(d.monthLabel)}</span>
            </div>
            <div class="day-header-badges">
              ${isToday ? `<span class="today-badge">Hoje</span>` : ""}
              <span class="day-count-badge ${cnt > 0 ? "has-items" : ""}">${cnt}</span>
            </div>
          </div>
        `;
      }

      for (const h of SCHEDULE_DATA.hours) {
        const rowHasAny = visibleDays.some(d => slotMap.has(`${d.date}_${h.hour}`));
        const emptyCls = rowHasAny ? "" : "row-empty";

        html += `
          <div class="cal-time-cell ${emptyCls}">
            <span class="cal-time-label">${h.start}</span>
            <span class="cal-time-sub">${h.end}</span>
          </div>
        `;

        for (const d of visibleDays) {
          const isToday = d.date === todayIso;
          const todayCls = isToday ? "is-today" : "";
          const banca = slotMap.get(`${d.date}_${h.hour}`);
          if (!banca) {
            html += `<div class="cal-slot-cell ${emptyCls} ${todayCls}"></div>`;
          } else {
            const colorTheme = state.selectedProfessor
              ? (profColorMap.get(state.selectedProfessor) || PALETTE[0])
              : PALETTE[(h.hour + d.dayNum) % PALETTE.length];

            const cardVars = [
              `--card-bg: ${colorTheme.bg}`,
              `--card-bg-elevated: ${colorTheme.bgElevated}`,
              `--card-accent: ${colorTheme.accent}`,
              `--card-accent-dark: ${colorTheme.accentDark}`,
              `--card-shadow-color: ${colorTheme.shadow}`
            ].join("; ");

            const hasConfirm = banca.professors.some(p => p.needsConfirm);
            const profHtml = banca.professors.map(p => {
              const isSel = state.selectedProfessor === p.name ? "is-selected" : "";
              const confirmCls = p.needsConfirm ? "needs-confirm" : "";
              return `<div class="prof-name-line ${isSel} ${confirmCls}" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</div>`;
            }).join("");

            html += `
              <div class="cal-slot-cell ${todayCls}">
                <button type="button" class="banca-card ${state.selectedProfessor ? "highlighted" : ""}" data-banca-id="${banca.id}" style="${cardVars}">
                  <div>
                    <div class="banca-card-top">
                      <span class="banca-time">${banca.startTime} – ${banca.endTime}</span>
                      <div class="banca-badges">
                        ${banca.isClosed ? `<span class="mini-badge badge-closed">Fechada</span>` : ""}
                        ${hasConfirm ? `<span class="mini-badge badge-confirm">Confirmar</span>` : ""}
                      </div>
                    </div>
                    <div class="banca-title" title="${escapeHtml(banca.title)}">${escapeHtml(banca.title)}</div>
                    ${banca.student ? `<div class="banca-student" title="${escapeHtml(banca.student)}">${escapeHtml(banca.student)}</div>` : ""}
                  </div>
                  <div class="banca-profs">
                    ${profHtml}
                  </div>
                </button>
              </div>
            `;
          }
        }
      }

      calendarGrid.innerHTML = html;

      const visibleTotal = Array.from(dayCounts.values()).reduce((a, b) => a + b, 0);
      if (filteredBancas.length === 0) {
        emptyWeekBanner.style.display = "flex";
        const terms = [];
        if (state.selectedProfessor) terms.push(state.selectedProfessor);
        else if (state.profQuery.trim()) terms.push(`prof. "${state.profQuery.trim()}"`);
        if (state.studentQuery.trim()) terms.push(`estudante "${state.studentQuery.trim()}"`);
        emptyWeekMsg.textContent = terms.length
          ? `Nenhuma banca encontrada para ${terms.join(" e ")}.`
          : "Nenhuma banca cadastrada.";
      } else {
        emptyWeekBanner.style.display = "none";
      }

      calendarGrid.querySelectorAll(".banca-card").forEach(card => {
        card.addEventListener("click", () => {
          const banca = SCHEDULE_DATA.bancas.find(b => b.id === card.dataset.bancaId);
          if (banca) openModal(banca);
        });
      });

      requestAnimationFrame(updateScrollArrows);
    }

    function openModal(banca) {
      const dayObj = SCHEDULE_DATA.days.find(d => d.date === banca.date);
      modalTimePill.textContent = `${dayObj ? dayObj.weekday + ", " + String(dayObj.dayNum).padStart(2, "0") + " " + dayObj.monthLabel : banca.date} · ${banca.startTime} – ${banca.endTime}${banca.isClosed ? " · Banca Fechada" : ""}`;
      modalTitle.textContent = banca.title;
      modalStudent.textContent = banca.student || "Não informado";

      modalProfsList.innerHTML = banca.professors.map(p => {
        const suffix = p.needsConfirm ? " (confirmar)" : "";
        return `<button type="button" class="modal-prof-chip" data-prof="${escapeHtml(p.name)}">${escapeHtml(p.name)}${suffix}</button>`;
      }).join("");

      modalProfsList.querySelectorAll(".modal-prof-chip").forEach(chip => {
        chip.addEventListener("click", () => {
          closeModal();
          selectProfessor(chip.dataset.prof);
        });
      });

      modalBackdrop.classList.add("open");
    }

    function closeModal() {
      modalBackdrop.classList.remove("open");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function render() {
      const filteredBancas = getFilteredBancas();
      renderHeaderMeta(filteredBancas);
      renderMiniCalendar(filteredBancas);
      renderCalendar(filteredBancas);
    }

    // Scroll controls (top arrows)
    scrollLeftBtn.addEventListener("click", () => {
      calendarScroll.scrollBy({ left: -440, behavior: "smooth" });
    });

    scrollRightBtn.addEventListener("click", () => {
      calendarScroll.scrollBy({ left: 440, behavior: "smooth" });
    });

    calendarScroll.addEventListener("scroll", updateScrollArrows, { passive: true });
    window.addEventListener("resize", updateScrollArrows);

    // Upload & Drag-and-Drop handlers
    uploadBtn.addEventListener("click", () => xlsxFileInput.click());
    xlsxFileInput.addEventListener("change", e => {
      const file = e.target.files[0];
      if (file) handleUploadedFile(file);
      e.target.value = "";
    });

    resetSourceBtn.addEventListener("click", () => {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      SCHEDULE_DATA = DEFAULT_SCHEDULE_DATA;
      state.selectedProfessor = null;
      state.profQuery = "";
      state.studentQuery = "";
      profSearchInput.value = "";
      studentSearchInput.value = "";
      clearProfSearchBtn.classList.remove("visible");
      clearStudentSearchBtn.classList.remove("visible");
      rebuildColorMap();
      render();
      showToast("Planilha original restaurada.");
    });

    let dragDepth = 0;
    window.addEventListener("dragenter", e => {
      e.preventDefault();
      dragDepth++;
      dropOverlay.classList.add("visible");
    });
    window.addEventListener("dragleave", e => {
      e.preventDefault();
      dragDepth = Math.max(0, dragDepth - 1);
      if (dragDepth === 0) dropOverlay.classList.remove("visible");
    });
    window.addEventListener("dragover", e => e.preventDefault());
    window.addEventListener("drop", e => {
      e.preventDefault();
      dragDepth = 0;
      dropOverlay.classList.remove("visible");
      const file = e.dataTransfer?.files?.[0];
      if (file) handleUploadedFile(file);
    });

    // Filter & Modal handlers
    clearFilterBtn.addEventListener("click", () => {
      state.selectedProfessor = null;
      render();
    });

    profSearchInput.addEventListener("input", e => {
      state.profQuery = e.target.value;
      if (state.selectedProfessor && state.profQuery) {
        state.selectedProfessor = null;
      }
      clearProfSearchBtn.classList.toggle("visible", Boolean(state.profQuery));
      render();
    });

    clearProfSearchBtn.addEventListener("click", () => {
      state.profQuery = "";
      profSearchInput.value = "";
      clearProfSearchBtn.classList.remove("visible");
      render();
      profSearchInput.focus();
    });

    studentSearchInput.addEventListener("input", e => {
      state.studentQuery = e.target.value;
      clearStudentSearchBtn.classList.toggle("visible", Boolean(state.studentQuery));
      render();
    });

    clearStudentSearchBtn.addEventListener("click", () => {
      state.studentQuery = "";
      studentSearchInput.value = "";
      clearStudentSearchBtn.classList.remove("visible");
      render();
      studentSearchInput.focus();
    });

    importCloseBtn.addEventListener("click", closeImportModal);
    importCancelBtn.addEventListener("click", closeImportModal);
    importConfirmBtn.addEventListener("click", applyImportedSchedule);
    importModalBackdrop.addEventListener("click", e => {
      if (e.target === importModalBackdrop) closeImportModal();
    });

    modalCloseBtn.addEventListener("click", closeModal);
    modalBackdrop.addEventListener("click", e => {
      if (e.target === modalBackdrop) closeModal();
    });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        closeModal();
        closeImportModal();
      }
    });

    rebuildColorMap();
    render();
  </script>
</body>
</html>
